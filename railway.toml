[build]
# The Dockerfile is the build definition, not RAILPACK: the private recipe modules
# are cloned during `prebuild` and that needs git + ssh, which only the Dockerfile
# can install. RAILPACK ignored buildCommand and generated its own image with no
# git, which failed five deploys and then shipped a stub build to production.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start"
# Prefer agent health (core) over bare HTML
healthcheckPath = "/api/agent/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
