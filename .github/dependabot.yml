version: 2

# Dependency PRs are only safe because CI exists. They land as normal PRs and
# are squash-merged like any other contribution.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-patch:
        dependency-type: production
        update-types: ["patch"]
    ignore:
      # Major bumps of the build/runtime spine are deliberate work, not a bot PR.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nitropack"
        update-types: ["version-update:semver-major"]

  # Dependabot auto-detected this nested manifest; make it explicit and grouped so
  # the adapter cannot open its own pile of PRs on top of the root queue.
  - package-ecosystem: npm
    directory: "/packages/beezilla-adapter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      adapter-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
