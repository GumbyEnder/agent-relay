version: 2

# Routine dependency churn arrives as ONE grouped PR per directory per month.
# Security updates ignore the limits entirely, so a real CVE still lands
# immediately — that is the balance we want on a repo that ships to production.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps of the build/runtime spine are deliberate work, not a bot PR.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nitropack"
        update-types: ["version-update:semver-major"]

  # Dependabot also scans this nested manifest — keep it explicit and grouped so
  # the adapter cannot open its own pile of PRs on top of the root queue.
  - package-ecosystem: npm
    directory: "/packages/beezilla-adapter"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
