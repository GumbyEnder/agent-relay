name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run — contributor PRs
# often arrive as a burst of fixup commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Never "production": npm skips devDependencies, which the test scripts need.
      NODE_ENV: development
      # Tests must not inherit a real mail provider or chat key from anywhere.
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Lint errors block: main is at zero (issue #265). Warnings are still
      # reported and do not block — burn those down separately.
      - name: Lint (errors block, warnings report)
        run: npm run lint

      # The Build step is the ONE step that must not inherit the job's development
      # NODE_ENV. `vite build` under NODE_ENV=development emits the DEV JSX runtime into
      # .output/server/_ssr/router-*.mjs, and every suite that boots the built server
      # spawns it with NODE_ENV=production (test-buzzy-jobs-ownership.mjs:101, and the
      # board/art suites the same way), where react resolves jsx-dev-runtime to its
      # production shape and jsxDEV does not exist:
      #   TypeError: (0 , import_jsx_dev_runtime.jsxDEV) is not a function
      #   FAIL server never became healthy
      # test:ci is an && chain, so that killed the seventh suite and every suite after
      # it — board-connect and the search-placeholder test never ran on main at all.
      # Install has already happened by now, so devDependencies survive this override.
      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Tests (hermetic subset)
        run: npm run test:ci

      # The probes that boot the built server are NOT in test:ci: they need Chromium
      # and a listening port, and test:ci must stay hermetic and fast. They run here,
      # after Build, on the same .output — a probe that is a file in scripts/ and
      # wired to nothing never fails anything, which is how the ?job= regression
      # (#416, CR-14b residual) reached live QA twice.
      - name: Install Chromium for the built-server probes
        run: npx playwright install --with-deps chromium

      - name: Probe — the address names the job it is in (CR-14c)
        env:
          # The server leg must be production: dev mode turns off Better Auth rate
          # limiting and emits the dev JSX runtime (see the Build note above).
          NODE_ENV: production
        run: |
          set -euo pipefail
          # PGLite ships its engine beside the bundle, and `npm run build` recreates
          # .output/. Without these the server boots, serves HTML, then 500s on the
          # first DB touch (ENOENT ... _libs/pglite.data) — which reads like a broken
          # sign-in, not a missing file.
          cp node_modules/@electric-sql/pglite/dist/pglite.data \
             node_modules/@electric-sql/pglite/dist/pglite.wasm \
             node_modules/@electric-sql/pglite/dist/initdb.wasm \
             .output/server/_libs/
          PORT=8244 AGENT_RELAY_DEV_MAIL=1 \
            BETTER_AUTH_URL=http://127.0.0.1:8244 \
            BETTER_AUTH_TRUSTED_ORIGINS=http://127.0.0.1:8244 \
            BETTER_AUTH_SECRET=ci-job-url-probe-secret \
            node .output/server/index.mjs > /tmp/job-url-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8244/buzzy/talk; then break; fi
            sleep 2
          done
          set +e
          npm run test:job-url -- http://127.0.0.1:8244
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then tail -40 /tmp/job-url-server.log; fi
          exit "$probe_rc"

      # Same shape as the job-url probe above, and for the same reason: this probe
      # lived only in scripts/ and a signed-in reviewer ran it by hand, which is how
      # "New conversation gives me nothing new" reached live QA at all (#408). It
      # drives real chat turns, so it needs a model — scripts/stand-in-model.mjs is
      # one: local, keyless, and it echoes the ask back, which the probe asserts on.
      - name: Probe — New conversation gives a new conversation (#408)
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          node scripts/stand-in-model.mjs --port 8246 --delay 3500 > /tmp/stand-in-model.log 2>&1 &
          stand_in_pid=$!
          cp node_modules/@electric-sql/pglite/dist/pglite.data \
             node_modules/@electric-sql/pglite/dist/pglite.wasm \
             node_modules/@electric-sql/pglite/dist/initdb.wasm \
             .output/server/_libs/
          PORT=8245 AGENT_RELAY_DEV_MAIL=1 \
            BETTER_AUTH_URL=http://127.0.0.1:8245 \
            BETTER_AUTH_TRUSTED_ORIGINS=http://127.0.0.1:8245 \
            BETTER_AUTH_SECRET=ci-new-conversation-secret \
            BZ_CHAT_BASE_URL=http://127.0.0.1:8246/v1 \
            BZ_CHAT_KEY=ci-stand-in BZ_CHAT_MODEL=stand-in BZ_EXTRACT_MODEL=stand-in \
            BZ_MAIL_LOG="$PWD/.data/outbound-mail.jsonl" \
            node .output/server/index.mjs > /tmp/new-conversation-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid $stand_in_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8245/buzzy/talk; then break; fi
            sleep 2
          done
          set +e
          npm run test:new-conversation -- http://127.0.0.1:8245
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            tail -40 /tmp/new-conversation-server.log
            tail -20 /tmp/stand-in-model.log
          fi
          exit "$probe_rc"

      # Third of the same shape: colonies are drag-and-drop in the agents strip,
      # so the only honest check is a real browser against the built server. The
      # probe was already in scripts/ and wired to nothing — the trap the two
      # probes above exist to close. BZ_FAKE_LLM points at the stand-in model so
      # its last check (BeeZilla's prompt names the colony) runs instead of
      # quietly skipping.
      - name: Probe — colonies in the agents strip (#364)
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          node scripts/stand-in-model.mjs --port 8248 --delay 800 > /tmp/stand-in-colonies.log 2>&1 &
          stand_in_pid=$!
          cp node_modules/@electric-sql/pglite/dist/pglite.data \
             node_modules/@electric-sql/pglite/dist/pglite.wasm \
             node_modules/@electric-sql/pglite/dist/initdb.wasm \
             .output/server/_libs/
          PORT=8247 AGENT_RELAY_DEV_MAIL=1 \
            BETTER_AUTH_URL=http://127.0.0.1:8247 \
            BETTER_AUTH_TRUSTED_ORIGINS=http://127.0.0.1:8247 \
            BETTER_AUTH_SECRET=ci-agent-colonies-secret \
            BZ_CHAT_BASE_URL=http://127.0.0.1:8248/v1 \
            BZ_CHAT_KEY=ci-stand-in BZ_CHAT_MODEL=stand-in BZ_EXTRACT_MODEL=stand-in \
            BZ_MAIL_LOG="$PWD/.data/outbound-mail.jsonl" \
            node .output/server/index.mjs > /tmp/agent-colonies-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid $stand_in_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8247/buzzy/talk; then break; fi
            sleep 2
          done
          set +e
          BZ_FAKE_LLM=http://127.0.0.1:8248 \
            BZ_MAIL_LOG="$PWD/.data/outbound-mail.jsonl" \
            npm run test:agent-colonies -- http://127.0.0.1:8247
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            tail -60 /tmp/agent-colonies-server.log
            tail -20 /tmp/stand-in-colonies.log
          fi
          exit "$probe_rc"

      # Fourth of the same shape: the Hive is where one of the person's agents asks BeeZilla,
      # and where BeeZilla asks one of them by name. The probe was already in scripts/ and
      # wired to nothing — the trap the three probes above exist to close. stand-in-model.mjs
      # answers ask_bzilla/ask_agent with a real tool call, then "Fake model reply" once the
      # delegation's result is in the conversation, which is what the probe waits for.
      - name: Probe — the Hive (#365)
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          node scripts/stand-in-model.mjs --port 8250 --delay 800 > /tmp/stand-in-hive.log 2>&1 &
          stand_in_pid=$!
          cp node_modules/@electric-sql/pglite/dist/pglite.data \
             node_modules/@electric-sql/pglite/dist/pglite.wasm \
             node_modules/@electric-sql/pglite/dist/initdb.wasm \
             .output/server/_libs/
          PORT=8249 AGENT_RELAY_DEV_MAIL=1 \
            BETTER_AUTH_URL=http://127.0.0.1:8249 \
            BETTER_AUTH_TRUSTED_ORIGINS=http://127.0.0.1:8249 \
            BETTER_AUTH_SECRET=ci-agent-hive-secret \
            BZ_CHAT_BASE_URL=http://127.0.0.1:8250/v1 \
            BZ_CHAT_KEY=ci-stand-in BZ_CHAT_MODEL=stand-in BZ_EXTRACT_MODEL=stand-in \
            BZ_MAIL_LOG="$PWD/.data/outbound-mail.jsonl" \
            node .output/server/index.mjs > /tmp/agent-hive-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid $stand_in_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8249/buzzy/talk; then break; fi
            sleep 2
          done
          set +e
          BZ_FAKE_LLM=http://127.0.0.1:8250 \
            BZ_MAIL_LOG="$PWD/.data/outbound-mail.jsonl" \
            npm run test:agent-hive -- http://127.0.0.1:8249
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            tail -60 /tmp/agent-hive-server.log
            tail -20 /tmp/stand-in-hive.log
          fi
          exit "$probe_rc"

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .output/server/index.mjs
          if-no-files-found: ignore
          retention-days: 3
