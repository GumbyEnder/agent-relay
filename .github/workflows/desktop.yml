name: desktop

# The desktop app had no CI at all, and two release-blocking defects shipped
# anyway: 0.2.0 could not launch at all, and every build up to 0.2.11 failed its
# readiness probe on networks where loopback name resolution is unavailable.
# This job builds a packaged tree and starts it, so "the installer is broken"
# fails here instead of in the owner's hands.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "desktop/**"
      - "src/lib/buzzy/**"
      - "public/buzzy/**"
      - "scripts/**"
      - "migrations/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/lib/buzzy/**"
      - "public/buzzy/**"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaged-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        # `npm run typecheck`, not `npx tsc` directly: the script carries the
        # pretypecheck hook that runs scripts/sync-private.mjs. `tsc` on its own
        # skips the hook, so src/lib/private/ is never populated and any file
        # importing it dies with TS2307 — which is exactly how this job failed
        # on main's wallet.nitro.ts (`@/lib/private/registry`) while a dev
        # machine with a synced checkout passed. With no credential the sync
        # writes the committed .private-stub/, so CI typechecks the public build.
        run: npm run typecheck

      - name: Build runtime
        run: npm run build

      - name: Stage the packaged app (runtime libs, migrations, PGLite)
        env:
          # CI has no publisher key set; the stage step refuses to build without
          # one, so give it an explicit, obviously-fake set rather than weakening
          # the check that protects real releases.
          BZ_RECIPE_PUBLISHER_FILE: ""
        run: |
          node -e '
            const fs = require("fs");
            // Field names are the contract trust.ts reads: { keyId, publicKey }.
            // This fixture used to write { id, key }, so loadPinFile() skipped the
            // entry while dist.mjs still counted one pin — the smoke test proved
            // nothing about the pin path.
            fs.writeFileSync("/tmp/ci-publishers.json", JSON.stringify({ publishers: [{ keyId: "ed25519:ci-smoke", publicKey: "ci-smoke-not-a-real-key" }] }));
          '
          BZ_RECIPE_PUBLISHER_FILE=/tmp/ci-publishers.json node desktop/dist.mjs stage

      - name: Install the desktop app's own dependencies
        # The root `npm ci` installs the server, not the app: desktop has its own
        # package.json. Without this, `npx electron-builder` fetched whatever the
        # registry was serving (26.18.0), found no electron in node_modules, and
        # refused to guess a version from the "^32.2.0" range — so Package died and
        # the smoke check below never ran.
        #
        # `npm install`, not `npm ci`: electron-builder declares a windows-only
        # optional dependency that a lock generated on linux cannot represent, so
        # npm ci rejects the app's lockfile here however it was produced. The
        # determinism that matters is the exact electron and electron-builder pins.
        run: npm install --prefix desktop --no-audit --no-fund

      - name: Package (directory target, no NSIS — this is a smoke test, not a release)
        run: |
          ./node_modules/.bin/electron-builder --version
          ./node_modules/.bin/electron-builder --dir --publish never
        working-directory: desktop

      - name: Start the packaged runtime and assert it serves
        run: node desktop/smoke.mjs

      - name: Upload the log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-logs
          path: |
            dist-desktop/**/*.log
            /tmp/*.log
          if-no-files-found: ignore
