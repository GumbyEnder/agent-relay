<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Join a team — BeeZilla</title>
  <style>
    :root {
      --bg: #0E0E0E;
      --panel: #151515;
      --line: #262626;
      --text: #F2F2F2;
      --muted: #A3A3A3;
      --accent: #FFC107;
      --bad: #FF8A80;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.55; -webkit-font-smoothing: antialiased; }
    .top { max-width: 560px; margin: 0 auto; padding: 1.1rem 16px 0; }
    .brand { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--text); font-weight: 700; text-decoration: none; }
    .brand-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(255, 193, 7, 0.6); }
    main { max-width: 560px; margin: 0 auto; padding: 1.2rem 16px 3rem; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem 1.6rem 1.8rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0.5rem 0; color: #D9D9D9; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.2rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.6rem; padding: 0.55rem 1.2rem; border-radius: 999px; border: 1px solid #333; background: transparent; color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn:hover { border-color: #6B5A1E; color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #141414; }
    .btn-primary:hover { background: #FFD54F; color: #141414; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .msg { margin-top: 1rem; }
    .msg.bad { color: var(--bad); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="top"><a class="brand" href="/"><span class="brand-dot" aria-hidden="true"></span>BeeZilla</a></div>
  <main>
    <section class="card" aria-live="polite">
      <h1 id="head">Opening your invitation…</h1>
      <p id="text"></p>
      <div class="actions hidden" id="signedOut">
        <a class="btn btn-primary" href="/login">Sign in</a>
        <a class="btn" href="/register">Create an account</a>
      </div>
      <div class="actions hidden" id="signedIn">
        <button type="button" class="btn btn-primary" id="joinBtn">Join the team</button>
      </div>
      <div class="actions hidden" id="done">
        <a class="btn btn-primary" href="/buzzy/talk">Go to BeeZilla</a>
      </div>
      <p class="msg" id="msg"></p>
    </section>
  </main>
  <script>
  /**
   * The page behind a team invitation link (/buzzy/join?token=…). Joining is an
   * explicit click, made while signed in with the invited address; the server checks
   * the address, the expiry and that the invitation is unused. A token is kept in this
   * browser while you go to sign in, so opening /buzzy/join afterwards still works.
   */
  (function () {
    "use strict";
    var KEY = "bz.pendingInvite";
    var head = document.getElementById("head");
    var text = document.getElementById("text");
    var msg = document.getElementById("msg");
    var joinBtn = document.getElementById("joinBtn");

    function show(id) {
      ["signedOut", "signedIn", "done"].forEach(function (k) {
        document.getElementById(k).classList.toggle("hidden", k !== id);
      });
    }
    function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (_) {} }
    function stored() { try { return localStorage.getItem(KEY) || ""; } catch (_) { return ""; } }

    var fromUrl = new URLSearchParams(location.search).get("token") || "";
    var token = /^[A-Za-z0-9_-]{8,80}$/.test(fromUrl) ? fromUrl : stored();
    if (!/^[A-Za-z0-9_-]{8,80}$/.test(token)) {
      head.textContent = "This invitation link is incomplete.";
      text.textContent = "Ask the person who invited you to send the whole link again.";
      return;
    }
    store(token);
    // Keep the token out of the address bar once it is saved.
    if (fromUrl) { try { history.replaceState(null, "", location.pathname); } catch (_) {} }

    fetch("/api/auth/get-session", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (s) {
        var user = s && s.user ? s.user : null;
        head.textContent = "You've been invited to a BeeZilla team";
        if (!user) {
          text.textContent = "Sign in, or create an account, with the email address this invitation was sent to. Then open the invitation link again — or come back to this page — to join.";
          show("signedOut");
          return;
        }
        text.textContent = "You're signed in as " + String(user.email || "") + ". Joining lets you work inside the team's BeeZilla with your own sign-in.";
        show("signedIn");
      });

    joinBtn.addEventListener("click", function () {
      joinBtn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Joining…";
      fetch("/api/buzzy/team/accept", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: token }),
      })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, data: j || {} }; }); })
        .catch(function () { return { ok: false, data: { error: "BeeZilla could not be reached. Check your connection and try again." } }; })
        .then(function (res) {
          if (res.ok && res.data.ok) {
            store("");
            head.textContent = "You're on the team";
            text.textContent = typeof res.data.note === "string" ? res.data.note : "You joined the team.";
            msg.textContent = "";
            show("done");
            return;
          }
          var code = res.data && res.data.code;
          if (code === "already_used" || code === "expired" || code === "not_found" || code === "already_owner") store("");
          msg.className = "msg bad";
          msg.textContent = typeof res.data.error === "string" && res.data.error ? res.data.error : "That didn't work. Try again in a moment.";
          joinBtn.disabled = code === "already_used" || code === "expired" || code === "not_found" || code === "already_owner";
        });
    });
  })();
  </script>
</body>
</html>
