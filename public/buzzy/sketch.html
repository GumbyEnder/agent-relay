<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeeZilla — Sketch</title>
<link rel="stylesheet" href="/buzzy/nav.css" />
<style>
  :root { --bz-bg:#0d0d0d; --bz-card:#151515; --bz-line:#242424; --bz-yellow:#ffd40d;
          --bz-text:#f2f2f2; --bz-muted:#8d8d8d; --bz-good:#6ee7a8; --bz-bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bz-bg); color:var(--bz-text); height:100vh; display:flex; flex-direction:column;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow:hidden;
         overscroll-behavior:none; }
  header { padding: 0.7rem 1rem 0.4rem; border-bottom: 1px solid var(--bz-line); }
  #bzNav { display:flex; flex-wrap:wrap; gap:0.9rem; padding-bottom:0.5rem; }
  #bzNav a { color:var(--bz-muted); text-decoration:none; font-size:0.84rem; }
  #bzNav a[data-nav="sketch"] { color: var(--bz-yellow); }
  .row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .title { font-weight:600; font-size:0.95rem; margin-right:auto; }
  input[type="text"] { background:#101010; border:1px solid var(--bz-line); color:var(--bz-text);
                       border-radius:8px; padding:0.35rem 0.55rem; font-size:0.86rem; }
  button { background:#1b1b1b; color:var(--bz-text); border:1px solid var(--bz-line); border-radius:8px;
           padding:0.3rem 0.5rem; font-size:0.8rem; cursor:pointer; }
  button:hover { border-color:#3a3a3a; }
  button.on { background:var(--bz-yellow); color:#111; border-color:var(--bz-yellow); font-weight:600; }
  button.primary { background:var(--bz-yellow); color:#111; font-weight:600; border-color:var(--bz-yellow); }
  button:disabled { opacity:0.5; cursor:default; }
  #stage { position:relative; flex:1 1 auto; min-height:0; min-width:0; overflow:hidden; background:#141414;
           touch-action:none; overscroll-behavior:contain; }
  /* nav.js moves body's children into #bzPage on the first soft hop, so #stage stops
     being a flex item of body and `flex:1` resolves against an auto-height block:
     the canvas collapsed to its content height (~83px) while a hard load looked fine.
     This rule travels with this page's stylesheet, which the shell enables only while
     Sketch is the active page. */
  #bzPage { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  #work { display:flex; flex:1 1 auto; min-height:0; min-width:0; }
  /* A canvas is a REPLACED element: `inset:0` pins its box but cannot stretch it, so its
     CSS size falls back to the intrinsic size of its bitmap. resize() sets that bitmap to
     stage x devicePixelRatio, so on any dpr>1 screen the board was displayed dpr times too
     large and clipped by #stage's overflow. Strokes are drawn in CSS px (pt() maps the
     pointer in CSS px, setTransform(dpr) scales to the bitmap), so the ink landed dpr times
     away from the cursor — right at dpr 1, inches off everywhere else. Pin the box in CSS
     and let the backing store follow the measurement. */
  #board { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;
           cursor:crosshair; }
  #layers { position:absolute; inset:0; pointer-events:none; }
  .img-wrap { position:absolute; pointer-events:auto; cursor:move; border:1px solid transparent; }
  .img-wrap.selected { border-color: var(--bz-yellow); }
  .img-wrap img { width:100%; height:100%; object-fit:fill; display:block; user-select:none; -webkit-user-drag:none; }
  .img-wrap .handle { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:var(--bz-yellow);
                      border-radius:2px; cursor:nwse-resize; pointer-events:auto; }
  footer { border-top:1px solid var(--bz-line); padding:0.5rem 1rem; display:flex; gap:0.6rem; align-items:center; }
  #status { color:var(--bz-muted); font-size:0.8rem; }
  #result { position:absolute; right:12px; top:12px; width:210px; background:var(--bz-card); border:1px solid var(--bz-line);
            border-radius:12px; padding:0.6rem; display:none; z-index:5; }
  #result img { width:100%; border-radius:8px; display:block; }
  #result a { color:var(--bz-yellow); font-size:0.8rem; text-decoration:none; display:inline-block; margin-top:0.4rem; }
  .hint { color:var(--bz-muted); font-size:0.78rem; }
  .drop { outline:2px dashed var(--bz-yellow); outline-offset:-8px; }

  #regionOverlay { position: absolute; inset: 0; cursor: crosshair; display: none; }
  #regionOverlay.on { display: block; }
  #regionRect { position: absolute; border: 2px dashed #ffd40d; background: rgba(255,212,13,0.16); display: none; }
  #regionPanel { display: flex; gap: 0.45rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
  #regionPanel input { flex: 1; min-width: 220px; }

  /* ── paint chrome ─────────────────────────────────────────────── */
  #toolbar { display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; padding:0.4rem 1rem;
             border-bottom:1px solid var(--bz-line); background:#111; }
  #toolbar .sep { width:1px; height:22px; background:var(--bz-line); margin:0 0.3rem; }
  .tool { min-width:2.1rem; padding:0.3rem 0.45rem; }
  .tool .glyph { font-size:0.95rem; line-height:1; }
  #sizeWrap, #tolWrap { display:flex; align-items:center; gap:0.35rem; font-size:0.76rem; color:var(--bz-muted); }
  #size, #tol { width:96px; accent-color: var(--bz-yellow); }
  .colors { position:relative; width:44px; height:34px; }
  .colors input { position:absolute; width:24px; height:24px; padding:0; border:2px solid #2a2a2a;
                  background:none; border-radius:6px; cursor:pointer; }
  #colorP { left:0; top:0; z-index:2; }
  #colorS { left:14px; top:9px; }
  #palette { display:flex; flex-wrap:wrap; gap:2px; max-width:250px; }
  #palette button { width:15px; height:15px; padding:0; border-radius:3px; border:1px solid #333; }
  select { background:#101010; border:1px solid var(--bz-line); color:var(--bz-text); border-radius:8px;
           padding:0.3rem; font-size:0.8rem; }
</style>
</head>
<body>
<header>
  <nav id="bzNav">
    <a href="/buzzy/talk" data-nav="talk">Talk</a>
    <a href="/buzzy/sketch" data-nav="sketch">Sketch</a>
    <a href="/buzzy/studio" data-nav="studio">Studio</a>
    <a href="/buzzy/library" data-nav="library">Library</a>
    <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
    <a href="/buzzy/memory" data-nav="memory">Memory</a>
    <a href="/buzzy/experts" data-nav="experts">Experts</a>
    <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
    <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
    <a href="/buzzy/upload" data-nav="publish">Publish</a>
  </nav>
  <div class="row">
    <span class="title" id="pTitle">Untitled board</span>
    <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button id="del" title="Delete the selected mark (Delete)">Delete mark</button>
    <button id="clear" title="Clear the canvas">Clear canvas</button>
    <button id="save">Save</button>
    <span id="savedFlag" style="font-size:.76rem;align-self:center"></span>
    <button id="shot" title="Download a PNG of the board">Export PNG</button>
    <button id="svg" title="Download the drawing as vector SVG (images are not included)">Export SVG</button>
  </div>
</header>

<div id="toolbar">
  <button class="tool on" data-tool="select" title="Select / move (S)"><span class="glyph">▣</span></button>
  <button class="tool" data-tool="pencil" title="Pencil — hard edge (P)"><span class="glyph">✏</span></button>
  <button class="tool" data-tool="brush" title="Brush (B)"><span class="glyph">🖌</span></button>
  <button class="tool" data-tool="eraser" title="Eraser — erases pixels (E)"><span class="glyph">◻</span></button>
  <button class="tool" data-tool="fill" title="Fill with colour (F)"><span class="glyph">🪣</span></button>
  <button class="tool" data-tool="picker" title="Pick a colour from the board (I)"><span class="glyph">💧</span></button>
  <button class="tool" data-tool="airbrush" title="Airbrush (A)"><span class="glyph">💨</span></button>
  <span class="sep"></span>
  <button class="tool" data-tool="line" title="Line (L)"><span class="glyph">╱</span></button>
  <button class="tool" data-tool="curve" title="Curve — drag, then move to bend, click to fix (C)"><span class="glyph">⌒</span></button>
  <button class="tool" data-tool="rect" title="Rectangle (R)"><span class="glyph">▭</span></button>
  <button class="tool" data-tool="rrect" title="Rounded rectangle (Shift+R)"><span class="glyph">▢</span></button>
  <button class="tool" data-tool="ellipse" title="Ellipse (O)"><span class="glyph">◯</span></button>
  <button class="tool" data-tool="triangle" title="Triangle (V)"><span class="glyph">△</span></button>
  <button class="tool" data-tool="polygon" title="Polygon — click each corner, double-click to close (Y)"><span class="glyph">⬠</span></button>
  <button class="tool" data-tool="star" title="Star (5)"><span class="glyph">★</span></button>
  <button class="tool" data-tool="arrow" title="Arrow (9)"><span class="glyph">➔</span></button>
  <button class="tool" data-tool="bubble" title="Speech bubble (6)"><span class="glyph">💬</span></button>
  <button class="tool" data-tool="text" title="Text — click to place a text box (T)"><span class="glyph">T</span></button>
  <span class="sep"></span>
  <div id="sizeWrap"><span>Size</span><input id="size" type="range" min="1" max="50" value="6" /><span id="sizeVal">6</span></div>
  <div id="tolWrap"><span>Fill tol.</span><input id="tol" type="range" min="0" max="120" value="24" /><span id="tolVal">24</span></div>
  <span class="sep"></span>
  <div class="colors" title="Primary (left click) / secondary (right click)">
    <input id="colorP" type="color" value="#ffd40d" />
    <input id="colorS" type="color" value="#ffffff" />
  </div>
  <div id="palette"></div>
  <select id="op" title="Shape style">
    <option value="outline">Outline</option>
    <option value="fill">Fill</option>
    <option value="both" selected>Outline + fill</option>
  </select>
</div>

<div id="work">
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="layers"></div>
    <div id="result">
      <img id="resultImg" alt="" />
      <!-- Region edit: drag a box on the picture, say what should change inside it.
           The mask is drawn here, at the picture's own size, so the server never has
           to guess which pixels the owner meant. -->
      <div id="regionOverlay" title="Drag to mark the area to change"><div id="regionRect"></div></div>
      <div id="regionPanel">
        <input id="regionPrompt" type="text" placeholder="What should change inside the box? e.g. 'make the coat red'" />
        <button class="primary" id="regionApply">Change this area</button>
        <span class="hint" id="regionStatus">Drag a box on the picture, then describe the change.</span>
      </div>
      <a id="resultLink" href="#" download>Download</a>
    </div>
  </div>
</div>

<footer>
  <input id="prompt" type="text" style="flex:1" placeholder="Describe what to create — e.g. 'a red car driving along the road I drew, evening light'" />
  <label class="hint" style="display:flex;align-items:center;gap:0.35rem" title="Send the last rendered picture as the reference instead of the board">
    <input type="checkbox" id="iterate" /> Iterate from last render
  </label>
  <button class="primary" id="create">Create</button>
  <span id="status">Drop or paste images, draw between them, then Create.</span>
</footer>

<script>
  // The board is an ordered set of things the owner placed: images they dropped,
  // pixels they painted, strokes they drew, and text. "Create" flattens the whole
  // thing into one reference image and asks the model to produce the result — so
  // connecting a car to a road IS the instruction, not a description of one.
  //
  // Two layers, because MS Paint has two kinds of tool:
  //   * the raster layer (`rasterCv`, doc pixels) holds everything that changes a
  //     pixel in place — eraser, bucket fill, airbrush, opened images.
  //   * `strokes` stays vector, so shapes and text stay crisp and exportable as SVG.
  // A pixel tool first rasterises the vector marks under it (rasterize()), so the
  // eraser really erases what it touches instead of sliding under the ink.
  (function () {
    var jobId = new URLSearchParams(location.search).get("job");
    var stage = document.getElementById("stage");
    var canvas = document.getElementById("board");
    var layers = document.getElementById("layers");
    var ctx = canvas.getContext("2d");
    var statusEl = document.getElementById("status");
    var promptEl = document.getElementById("prompt");
    var titleEl = document.getElementById("pTitle");

    var doc = { w: 1, h: 1, bg: "#141414", raster: null, strokes: [], images: [] };
    var view = { zoom: 1, panX: 0, panY: 0 };
    var tool = "select";
    var colorP = "#ffd40d";
    var colorS = "#ffffff";
    var size = 6;
    var tolerance = 24;
    var op = "both";
    var selected = null;          // selected image id
    var selectedStroke = null;
    var draft = null;
    var rasterCv = null;          // pixel layer, doc-sized

    // Undo is a stack of board snapshots, not a pile of per-tool inverses: pixels,
    // strokes, text and image positions are one document, so one snapshot restores all.
    var lastRenderUrl = null;
    var undoStack = [];
    var redoStack = [];

    function newId() { return "s_" + Math.random().toString(36).slice(2, 9); }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

    // ── pixel layer ───────────────────────────────────────────────────
    function ensureRaster() {
      var w = Math.max(1, Math.round(doc.w)), h = Math.max(1, Math.round(doc.h));
      if (rasterCv && rasterCv.width === w && rasterCv.height === h) return rasterCv;
      var old = rasterCv;
      rasterCv = document.createElement("canvas");
      rasterCv.width = w; rasterCv.height = h;
      var g = rasterCv.getContext("2d");
      if (old && old.width === w && old.height === h) g.drawImage(old, 0, 0);
      else if (old) g.drawImage(old, 0, 0);        // crop/extend rather than lose pixels
      return rasterCv;
    }
    function rasterData() {
      if (!rasterCv) return null;
      // An all-transparent layer is a null, not a megabyte of empty PNG.
      var g = rasterCv.getContext("2d");
      var d = g.getImageData(0, 0, rasterCv.width, rasterCv.height).data;
      for (var i = 3; i < d.length; i += 4) if (d[i]) return rasterCv.toDataURL("image/png");
      return null;
    }
    function clearRaster() {
      ensureRaster().getContext("2d").clearRect(0, 0, rasterCv.width, rasterCv.height);
    }
    function loadRaster(url) {
      doc.raster = url || null;
      ensureRaster();
      var g = rasterCv.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, rasterCv.width, rasterCv.height);
      if (!url) { paint(); return; }
      var im = new Image();
      im.onload = function () { g.drawImage(im, 0, 0, doc.w, doc.h); paint(); };
      im.src = url;
    }
    // Flatten the vector marks into the pixel layer. Called by every pixel tool, so
    // "erase under that arrow" means the arrow's pixels, not the arrow object.
    function rasterize() {
      if (!doc.strokes.length) { ensureRaster(); return; }
      ensureRaster();
      var g = rasterCv.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.save();
      doc.strokes.forEach(function (s) { drawMark(g, s, false); });
      g.restore();
      doc.strokes = [];
      selectedStroke = null;
    }

    // ── drawing ───────────────────────────────────────────────────────
    function roundRectPath(g, x, y, w, h, r) {
      r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
      g.moveTo(x + r, y);
      g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
      g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
      g.closePath();
    }
    function starPath(g, cx, cy, R, r, n) {
      for (var i = 0; i < n * 2; i++) {
        var a = -Math.PI / 2 + i * Math.PI / n;
        var rad = i % 2 ? r : R;
        var x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a);
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath();
    }
    function shapePath(g, s) {
      var x1 = s.x1, y1 = s.y1, x2 = s.x2, y2 = s.y2;
      var x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
      switch (s.tool) {
        case "line": case "arrow":
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); break;
        case "curve":
          g.beginPath(); g.moveTo(x1, y1);
          g.quadraticCurveTo(s.cx === undefined ? (x1 + x2) / 2 : s.cx,
                             s.cy === undefined ? (y1 + y2) / 2 : s.cy, x2, y2);
          break;
        case "rect": g.beginPath(); g.rect(x, y, w, h); break;
        case "rrect": g.beginPath(); roundRectPath(g, x, y, w, h, Math.min(20, Math.min(w, h) / 4)); break;
        case "ellipse":
          g.beginPath();
          g.ellipse(x + w / 2, y + h / 2, Math.max(w / 2, 0.5), Math.max(h / 2, 0.5), 0, 0, Math.PI * 2);
          break;
        case "triangle":
          g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.closePath(); break;
        case "diamond":
          g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w, y + h / 2);
          g.lineTo(x + w / 2, y + h); g.lineTo(x, y + h / 2); g.closePath(); break;
        case "star":
          g.beginPath(); starPath(g, x + w / 2, y + h / 2, Math.max(w, h) / 2, Math.max(w, h) / 4.4, 5); break;
        case "bubble":
          g.beginPath();
          roundRectPath(g, x, y, w, h * 0.78, Math.min(18, Math.min(w, h) / 5));
          // One path with two subpaths: fill and stroke both cover body + tail.
          g.moveTo(x + w * 0.22, y + h * 0.77);
          g.lineTo(x + w * 0.16, y + h);
          g.lineTo(x + w * 0.40, y + h * 0.77);
          g.closePath();
          break;
        case "polygon":
          g.beginPath();
          (s.points || []).forEach(function (p, i) { i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); });
          if (s.closed !== false) g.closePath();
          break;
      }
    }

    function fontFor(s) {
      var it = s.italic ? "italic " : "";
      var wt = s.bold ? "700 " : "400 ";
      return it + wt + (s.size || 20) + "px " + (s.font || "Inter, 'Segoe UI', sans-serif");
    }

    // One renderer for screen, PNG, JPG and the model's reference: the exported file
    // cannot drift from the board by having a second drawing routine.
    function drawMark(g, s, isDraft) {
      var w = s.width || 3;
      g.save();
      g.lineCap = s.tool === "pencil" ? "butt" : "round";
      g.lineJoin = s.tool === "pencil" ? "miter" : "round";
      g.setLineDash(isDraft ? [6, 4] : []);
      var stroke = s.color || colorP;
      var fill = s.fillColor || null;

      if (s.tool === "pencil" || s.tool === "brush") {
        var pts = s.points || [];
        if (pts.length) {
          g.strokeStyle = stroke;
          if (pts.length === 1) {
            g.beginPath();
            g.arc(pts[0].x, pts[0].y, Math.max(0.5, (pts[0].p ? w * pts[0].p : w) / 2), 0, Math.PI * 2);
            g.fillStyle = stroke; g.fill();
          } else {
            for (var i = 1; i < pts.length; i++) {
              var a = pts[i - 1], b = pts[i];
              g.lineWidth = Math.max(0.5, w * (b.p ? b.p : 1));
              g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
            }
          }
        }
      } else if (s.tool === "text") {
        var at = { x: s.x1, y: s.y1 };
        g.font = fontFor(s);
        g.textBaseline = "top";
        g.fillStyle = stroke;
        if (s.bg) {
          var m = g.measureText(s.text || "");
          var lh = (s.size || 20) * 1.3;
          var lines = String(s.text || "").split("\n");
          var tw = m.width;
          lines.forEach(function (ln) { tw = Math.max(tw, g.measureText(ln).width); });
          g.globalAlpha = 1;
          g.fillStyle = s.bg;
          g.fillRect(at.x - 4, at.y - 3, tw + 8, lh * lines.length + 6);
          g.fillStyle = stroke;
        }
        String(s.text || "").split("\n").forEach(function (ln, li) {
          g.fillText(ln, at.x, at.y + li * (s.size || 20) * 1.3);
          if (s.underline) {
            var mw = g.measureText(ln).width;
            g.fillRect(at.x, at.y + li * (s.size || 20) * 1.3 + (s.size || 20) * 1.06, mw, Math.max(1, (s.size || 20) / 16));
          }
        });
      } else {
        shapePath(g, s);
        if (s.tool === "arrow") {
          g.lineWidth = w; g.strokeStyle = stroke; g.stroke();
          var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          var head = Math.max(10, w * 3);
          g.beginPath();
          g.moveTo(s.x2, s.y2);
          g.lineTo(s.x2 - head * Math.cos(ang - 0.42), s.y2 - head * Math.sin(ang - 0.42));
          g.lineTo(s.x2 - head * Math.cos(ang + 0.42), s.y2 - head * Math.sin(ang + 0.42));
          g.closePath();
          g.fillStyle = fill || stroke; g.fill();
          if (fill) { g.lineWidth = w; g.strokeStyle = stroke; g.stroke(); }
        } else if (s.tool === "curve") {
          g.lineWidth = w; g.strokeStyle = stroke; g.stroke();
          if (fill) { g.fillStyle = fill; g.fill(); }
        } else {
          if (fill) { g.fillStyle = fill; g.fill(); }
          if (s.op !== "fill") { g.lineWidth = w; g.strokeStyle = stroke; g.stroke(); }
        }
      }
      g.restore();

      if (s.id && s.id === selectedStroke) {
        var b = markBBox(s);
        g.save();
        g.setLineDash([5, 4]);
        g.strokeStyle = "rgba(255,212,13,0.9)";
        g.lineWidth = 1 / (view.zoom || 1);
        g.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
        g.restore();
      }
    }

    function markBBox(s) {
      if ((s.tool === "pencil" || s.tool === "brush")) {
        var pts = s.points || [];
        if (!pts.length) return { x: 0, y: 0, w: 0, h: 0 };
        var x0 = pts[0].x, y0 = pts[0].y, x1 = x0, y1 = y0;
        pts.forEach(function (p) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
        var pad = (s.width || 3) / 2;
        return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + pad * 2, h: y1 - y0 + pad * 2 };
      }
      if (s.tool === "text") {
        var lines = String(s.text || "").split("\n");
        var fs = s.size || 20;
        return { x: s.x1 - 4, y: s.y1 - 3, w: Math.max(20, (s.w || 90)) , h: lines.length * fs * 1.3 + 6 };
      }
      if (s.tool === "polygon") {
        var ps = s.points || [];
        if (!ps.length) return { x: 0, y: 0, w: 0, h: 0 };
        var a0 = ps[0].x, b0 = ps[0].y, a1 = a0, b1 = b0;
        ps.forEach(function (p) { a0 = Math.min(a0, p.x); b0 = Math.min(b0, p.y); a1 = Math.max(a1, p.x); b1 = Math.max(b1, p.y); });
        return { x: a0, y: b0, w: a1 - a0, h: b1 - b0 };
      }
      var x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      var w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      if (s.tool === "star") { var r = Math.max(w, h); x = (s.x1 + s.x2) / 2 - r / 2; y = (s.y1 + s.y2) / 2 - r / 2; w = h = r; }
      return { x: x, y: y, w: w, h: h };
    }

    function paintOverlays() { /* stage 3 adds the selection marquee */ }

    function paint() {
      var dpr = window.devicePixelRatio || 1;
      var r = canvas.getBoundingClientRect();
      var bw = Math.max(1, Math.round(r.width * dpr)), bh = Math.max(1, Math.round(r.height * dpr));
      if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
      var g = ctx;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, bw, bh);
      var s = dpr * view.zoom;
      g.setTransform(s, 0, 0, s, dpr * view.panX, dpr * view.panY);
      // paper
      g.save();
      g.shadowColor = "rgba(0,0,0,0.55)"; g.shadowBlur = 12 / view.zoom;
      g.fillStyle = doc.bg; g.fillRect(0, 0, doc.w, doc.h);
      g.restore();
      g.save();
      g.beginPath(); g.rect(0, 0, doc.w, doc.h); g.clip();
      if (rasterCv) g.drawImage(rasterCv, 0, 0, doc.w, doc.h);
      doc.strokes.forEach(function (st) { drawMark(g, st, false); });
      if (draft) drawMark(g, draft, true);
      g.restore();
      // paper edge
      g.save(); g.strokeStyle = "rgba(255,255,255,0.09)"; g.lineWidth = 1 / view.zoom;
      g.strokeRect(0.5 / view.zoom, 0.5 / view.zoom, doc.w, doc.h); g.restore();
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintOverlays(g);
      syncImages();
    }

    // Screen (CSS px inside #stage) → document coordinates.
    function pt(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left - view.panX) / view.zoom, y: (e.clientY - r.top - view.panY) / view.zoom };
    }
    function inDoc(p) { return p.x >= 0 && p.y >= 0 && p.x <= doc.w && p.y <= doc.h; }

    function segDist(p, a, b) {
      var vx = b.x - a.x, vy = b.y - a.y;
      var wx = p.x - a.x, wy = p.y - a.y;
      var len2 = vx * vx + vy * vy;
      var t = len2 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2)) : 0;
      var dx = p.x - (a.x + t * vx), dy = p.y - (a.y + t * vy);
      return Math.sqrt(dx * dx + dy * dy);
    }
    // Which mark is under the cursor? Bounding box first (cheap), segments for lines.
    function hitTest(p) {
      for (var i = doc.strokes.length - 1; i >= 0; i--) {
        var st = doc.strokes[i];
        if (st.tool === "line" || st.tool === "arrow" || st.tool === "curve") {
          var d = segDist(p, { x: st.x1, y: st.y1 }, { x: st.x2, y: st.y2 });
          if (d < Math.max(8, (st.width || 3) / 2 + 4)) return st;
        }
        var b = markBBox(st), pad = 6;
        if (p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad) return st;
      }
      return null;
    }

    // A note belongs to a mark, not to a coordinate: "this road is too narrow" must
    // stay attached to the road when the drawing around it moves. Anchor = mark id;
    // the note's own x1/y1 is only a fallback for marks that no longer exist.
    function anchorPoint(id) {
      var st = null;
      for (var i = 0; i < doc.strokes.length; i++) if (doc.strokes[i].id === id) { st = doc.strokes[i]; break; }
      if (!st) return null;
      var b = markBBox(st);
      return { x: b.x + b.w / 2, y: b.y - 6 };
    }

    // ── undo ──────────────────────────────────────────────────────────
    function snapshot() {
      undoStack.push(JSON.stringify({
        strokes: doc.strokes, images: doc.images, w: doc.w, h: doc.h, bg: doc.bg, raster: rasterData(),
      }));
      redoStack.length = 0;
      // The first mark is the moment this board becomes a project; a page you
      // merely looked at is not one.
      ensureJob().then(autoSave, function () { /* a scratch board that cannot be saved is not an error toast */ });
    }
    function applySnapshot(json) {
      var d = JSON.parse(json);
      doc.strokes = d.strokes || [];
      doc.images = d.images || [];
      if (d.bg) doc.bg = d.bg;
      if (d.w && d.h) { doc.w = d.w; doc.h = d.h; rasterCv = null; ensureRaster(); }
      selectedStroke = null;
      loadRaster(d.raster || null);
      renderImages();
      paint();
    }
    function current() { return JSON.stringify({ strokes: doc.strokes, images: doc.images, w: doc.w, h: doc.h, bg: doc.bg, raster: rasterData() }); }
    function undo() {
      if (!undoStack.length) { setStatus("Nothing to undo."); return; }
      redoStack.push(current());
      applySnapshot(undoStack.pop());
      setStatus("Undone.");
      autoSave();
    }
    function redo() {
      if (!redoStack.length) { setStatus("Nothing to redo."); return; }
      undoStack.push(current());
      applySnapshot(redoStack.pop());
      setStatus("Redone.");
      autoSave();
    }

    // ── autosave ──────────────────────────────────────────────────────
    var saveTimer = null, saving = false, saveAgain = false;
    function autoSave() {
      if (!jobId) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { flushSave(); }, 1200);
    }
    function flushSave() {
      if (!jobId) return;
      if (saving) { saveAgain = true; return; }
      saving = true;
      var body = JSON.stringify({ action: "save", jobId: jobId, board: boardJson() });
      // Chromium refuses a keepalive request whose body is over 64 KiB, and a board
      // with a pixel layer is far past that: every save would fail silently. Keep the
      // unload guarantee only for boards that fit, and let the ordinary fetch carry
      // the big ones (the 1.2s autosave is what persists those).
      fetch("/api/buzzy/art", {
        method: "POST", credentials: "same-origin", keepalive: body.length < 60000,
        headers: { "content-type": "application/json" },
        body: body,
      }).then(function (r) { if (!r.ok) throw new Error("save failed"); setSaved(true); })
        .catch(function () { setSaved(false); })
        .then(function () {
          saving = false;
          if (saveAgain) { saveAgain = false; flushSave(); }
        });
    }
    function setSaved(ok) {
      var el = document.getElementById("savedFlag");
      if (!el) return;
      el.textContent = ok ? "Saved to project" : "Not saved — retrying";
      el.style.color = ok ? "#6ee7a8" : "#ff6b6b";
      if (ok) { clearTimeout(el._t); el._t = setTimeout(function () { el.textContent = ""; }, 2500); }
    }
    window.addEventListener("pagehide", function () { if (jobId) flushSave(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });

    function boardJson() {
      return {
        version: 2, w: doc.w, h: doc.h, bg: doc.bg, raster: rasterData(),
        strokes: doc.strokes,
        images: doc.images.map(function (i) { return { x: i.x, y: i.y, w: i.w, h: i.h, url: i.url }; }),
      };
    }

    // ── pixel tools ───────────────────────────────────────────────────
    function eraseAt(a, b) {
      var g = rasterCv.getContext("2d");
      g.save();
      g.globalCompositeOperation = "destination-out";
      g.strokeStyle = "#000"; g.fillStyle = "#000";
      g.lineWidth = size; g.lineCap = "round"; g.lineJoin = "round";
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      g.restore();
      paint();
    }
    function floodFill(p, hex) {
      rasterize();
      var w = rasterCv.width, h = rasterCv.height;
      var x0 = Math.floor(p.x), y0 = Math.floor(p.y);
      if (x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
      var g = rasterCv.getContext("2d");
      var img = g.getImageData(0, 0, w, h);
      var d = img.data;
      var si = (y0 * w + x0) * 4;
      var sr = d[si], sg = d[si + 1], sb = d[si + 2], sa = d[si + 3];
      var rgb = hexToRgb(hex);
      var tol = tolerance;
      // Squared-distance tolerance on RGBA, so a 0 tolerance is exact-match and a
      // high one still stops at the stroke that encloses the area.
      function match(i) {
        var dr = d[i] - sr, dg = d[i + 1] - sg, db = d[i + 2] - sb, da = d[i + 3] - sa;
        return dr * dr + dg * dg + db * db + da * da <= tol * tol * 4;
      }
      if (sa === 255 && sr === rgb.r && sg === rgb.g && sb === rgb.b) return;
      var stack = [[x0, y0]];
      var seen = new Uint8Array(w * h);
      while (stack.length) {
        var cur = stack.pop();
        var x = cur[0], y = cur[1];
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        var idx = y * w + x;
        if (seen[idx]) continue;
        seen[idx] = 1;
        var i4 = idx * 4;
        if (!match(i4)) continue;
        d[i4] = rgb.r; d[i4 + 1] = rgb.g; d[i4 + 2] = rgb.b; d[i4 + 3] = 255;
        stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
      }
      g.putImageData(img, 0, 0);
      paint();
    }
    function hexToRgb(h) {
      h = String(h || "#000000").replace("#", "");
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return { r: parseInt(h.slice(0, 2), 16) || 0, g: parseInt(h.slice(2, 4), 16) || 0, b: parseInt(h.slice(4, 6), 16) || 0 };
    }
    function spray(p, hex) {
      var g = rasterCv.getContext("2d");
      g.save(); g.fillStyle = hex;
      var n = Math.max(8, size);
      var rad = Math.max(2, size * 1.6);
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * rad;
        g.globalAlpha = 0.75;
        g.fillRect(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr, 1.2, 1.2);
      }
      g.restore();
      paint();
    }
    function pickColor(e, secondary) {
      var r = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      var x = Math.round((e.clientX - r.left) * dpr), y = Math.round((e.clientY - r.top) * dpr);
      if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
      var d = ctx.getImageData(x, y, 1, 1).data;
      var hex = "#" + [d[0], d[1], d[2]].map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("");
      if (secondary) { colorS = hex; document.getElementById("colorS").value = hex; }
      else { colorP = hex; document.getElementById("colorP").value = hex; }
      setStatus("Picked " + hex + (secondary ? " as secondary." : " as primary."));
    }

    // ── pointer ───────────────────────────────────────────────────────
    var mode = null;          // what the current gesture is doing
    var sprayTimer = null;
    var rightBtn = false;
    var curvePending = null;
    var polyDraft = null;

    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    canvas.addEventListener("pointerdown", function (e) {
      if (e.button === 2) rightBtn = true;
      var p = pt(e);

      if (tool === "select") {
        var hit = hitTest(p);
        selectedStroke = hit ? hit.id : null;
        paint();
        return;
      }
      if (tool === "picker") { pickColor(e, e.button === 2); return; }
      if (tool === "fill") {
        if (!inDoc(p)) return;
        snapshot();
        floodFill(p, e.button === 2 ? colorS : colorP);
        setStatus("Filled.");
        autoSave();
        return;
      }
      if (tool === "text") {
        var t = window.prompt("Text:");
        if (t) {
          snapshot();
          var hit2 = hitTest(p);
          doc.strokes.push({ id: newId(), tool: "text", color: e.button === 2 ? colorS : colorP,
                             x1: p.x, y1: p.y, text: t, size: 20, anchor: hit2 ? hit2.id : null });
          paint();
          setStatus(hit2 ? "Text attached to that mark." : "Text added.");
          autoSave();
        }
        return;
      }

      canvas.setPointerCapture(e.pointerId);
      snapshot();
      if (tool === "eraser") {
        rasterize();
        mode = "erase";
        erasePrev = p;
        eraseAt(p, { x: p.x + 0.01, y: p.y + 0.01 });
        return;
      }
      if (tool === "airbrush") {
        rasterize();
        mode = "spray";
        var hex = e.button === 2 ? colorS : colorP;
        spray(p, hex);
        clearInterval(sprayTimer);
        sprayTimer = setInterval(function () { spray(lastPoint, hex); }, 60);
        lastPoint = p;
        return;
      }
      if (tool === "polygon") {
        if (!polyDraft) {
          polyDraft = { id: newId(), tool: "polygon", color: e.button === 2 ? colorS : colorP,
                        width: size, op: op, fillColor: e.button === 2 ? colorP : colorS,
                        points: [p], closed: false };
        } else {
          polyDraft.points.push(p);
        }
        draft = polyDraft;
        paint();
        return;
      }
      if (tool === "curve" && curvePending) {
        // Second click fixes the bend.
        curvePending.cx = p.x; curvePending.cy = p.y;
        curvePending.id = newId();
        doc.strokes.push(curvePending);
        curvePending = null; draft = null;
        paint(); autoSave();
        return;
      }

      var col = e.button === 2 ? colorS : colorP;
      if (tool === "pencil" || tool === "brush") {
        mode = "draw";
        draft = { tool: tool, color: col, width: size, points: [withPressure(p, e)] };
      } else {
        mode = "shape";
        draft = { tool: tool, color: col, width: size, op: op,
                  fillColor: op === "outline" ? null : (e.button === 2 ? colorP : colorS),
                  x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      }
      paint();
    });

    function withPressure(p, e) {
      var q = { x: p.x, y: p.y };
      if (e.pointerType === "pen" && e.pressure > 0.02) q.p = clamp(e.pressure * 1.4, 0.15, 2);
      return q;
    }

    var lastPoint = { x: 0, y: 0 };
    var erasePrev = null;
    canvas.addEventListener("pointermove", function (e) {
      var p = pt(e);
      lastPoint = p;
      if (curvePending && !mode) {
        curvePending.cx = p.x; curvePending.cy = p.y;
        draft = curvePending; paint(); return;
      }
      if (polyDraft && !mode) {
        // live rubber band from the last corner
        draft = { tool: "polygon", color: polyDraft.color, width: polyDraft.width, op: polyDraft.op,
                  fillColor: polyDraft.fillColor, closed: false,
                  points: polyDraft.points.concat([p]) };
        paint(); return;
      }
      if (!mode) return;
      if (mode === "erase") { eraseAt(erasePrev, p); erasePrev = p; return; }
      if (mode === "spray") return;             // the interval stamps
      if (mode === "draw") {
        draft.points.push(withPressure(p, e));
      } else if (mode === "shape") {
        draft.x2 = p.x; draft.y2 = p.y;
      }
      paint();
    });

    canvas.addEventListener("pointerup", function (e) {
      if (mode === "spray") { clearInterval(sprayTimer); sprayTimer = null; mode = null; autoSave(); return; }
      if (mode === "erase") { mode = null; autoSave(); return; }
      if (mode === "draw" || mode === "shape") {
        mode = null;
        if (draft) {
          var d = draft;
          draft = null;
          if ((d.tool === "pencil" || d.tool === "brush")) {
            if (d.points.length >= 1) { d.id = newId(); doc.strokes.push(d); }
          } else if (Math.abs(d.x2 - d.x1) + Math.abs(d.y2 - d.y1) > 2) {
            if (d.tool === "curve") {
              d.cx = (d.x1 + d.x2) / 2; d.cy = (d.y1 + d.y2) / 2;
              curvePending = d;
              setStatus("Move to bend the curve, then click to fix it.");
            } else {
              d.id = newId();
              doc.strokes.push(d);
            }
          }
        }
        paint();
        setStatus(doc.strokes.length + " marks on the board");
        autoSave();
      }
      rightBtn = false;
    });
    canvas.addEventListener("pointercancel", function () {
      mode = null; draft = null; clearInterval(sprayTimer); sprayTimer = null; paint();
    });

    // A polygon stays open until a double-click or Enter closes it.
    canvas.addEventListener("dblclick", function () {
      if (polyDraft) closePolygon();
    });
    function closePolygon() {
      if (!polyDraft) return;
      polyDraft.closed = true;
      if (polyDraft.points.length > 2) { polyDraft.id = newId(); doc.strokes.push(polyDraft); }
      polyDraft = null; draft = null;
      paint(); autoSave(); setStatus(doc.strokes.length + " marks on the board");
    }

    // ── images: drop, paste, move, resize ─────────────────────────────
    function addImage(url, at) {
      var w = 240, h = 160;
      var img = new Image();
      img.onload = function () {
        var ratio = img.naturalHeight / img.naturalWidth || 0.66;
        h = Math.round(w * ratio);
        place(url, at, w, h);
      };
      img.onerror = function () { place(url, at, w, h); };
      img.src = url;
    }
    function place(url, at, w, h) {
      snapshot();
      var item = { id: "im_" + Math.random().toString(36).slice(2, 9), url: url, x: at.x, y: at.y, w: w, h: h };
      doc.images.push(item);
      renderImages();
      autoSave();
    }
    function syncImages() {
      Array.prototype.forEach.call(layers.children, function (wrap) {
        var id = wrap.getAttribute("data-id");
        var im = doc.images.find(function (x) { return x.id === id; });
        if (!im) return;
        wrap.style.left = (im.x * view.zoom + view.panX) + "px";
        wrap.style.top = (im.y * view.zoom + view.panY) + "px";
        wrap.style.width = (im.w * view.zoom) + "px";
        wrap.style.height = (im.h * view.zoom) + "px";
      });
    }
    function renderImages() {
      layers.innerHTML = "";
      doc.images.forEach(function (im) {
        var wrap = document.createElement("div");
        wrap.className = "img-wrap" + (selected === im.id ? " selected" : "");
        wrap.setAttribute("data-id", im.id);
        var img = document.createElement("img");
        img.src = im.url;
        img.alt = "";
        var handle = document.createElement("div");
        handle.className = "handle";
        wrap.appendChild(img);
        wrap.appendChild(handle);
        wrap.addEventListener("pointerdown", function (e) {
          if (tool !== "select") return;
          e.stopPropagation();
          selected = im.id;
          drag = { id: im.id, mode: e.target === handle ? "resize" : "move", sx: e.clientX, sy: e.clientY, ox: im.x, oy: im.y, ow: im.w, oh: im.h };
          renderImages();
        });
        layers.appendChild(wrap);
      });
      syncImages();
    }
    var drag = null;
    window.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var im = doc.images.find(function (x) { return x.id === drag.id; });
      if (!im) return;
      var dx = (e.clientX - drag.sx) / view.zoom, dy = (e.clientY - drag.sy) / view.zoom;
      if (drag.mode === "move") { im.x = drag.ox + dx; im.y = drag.oy + dy; }
      else { im.w = Math.max(40, drag.ow + dx); im.h = Math.max(40, drag.oh + dy); }
      syncImages();
    });
    window.addEventListener("pointerup", function () {
      if (!drag) return;
      drag = null;
      autoSave();
    });

    stage.addEventListener("dragover", function (e) { e.preventDefault(); stage.classList.add("drop"); });
    stage.addEventListener("dragleave", function () { stage.classList.remove("drop"); });
    stage.addEventListener("drop", function (e) {
      e.preventDefault();
      stage.classList.remove("drop");
      var at = pt(e);
      for (const f of e.dataTransfer.files) {
        if (!f.type.startsWith("image/")) continue;
        var url = URL.createObjectURL(f);
        addImage(url, at);
      }
    });
    window.addEventListener("paste", function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type.indexOf("image") === 0) {
          var f = it.getAsFile();
          if (f) addImage(URL.createObjectURL(f), { x: 40 + doc.images.length * 20, y: 40 + doc.images.length * 20 });
        }
      }
    });

    // ── toolbar wiring ────────────────────────────────────────────────
    function setTool(t) {
      if (polyDraft) closePolygon();
      if (curvePending) { curvePending = null; draft = null; }
      tool = t;
      document.querySelectorAll("[data-tool]").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-tool") === t);
      });
      canvas.style.cursor = t === "select" ? "default" : t === "picker" ? "copy" : "crosshair";
      setStatus(toolHint(t));
      paint();
    }
    function toolHint(t) {
      var hints = {
        select: "Click a mark to select it; Delete removes it. Drag images to move them.",
        pencil: "Pencil: drag to draw a hard edge.", brush: "Brush: drag to paint.",
        eraser: "Eraser: drag over pixels to erase them.",
        fill: "Fill: click an area to flood it with colour.", picker: "Pick: click to take a colour.",
        airbrush: "Airbrush: hold and drag to spray.",
        line: "Line: drag.", curve: "Curve: drag, then move to bend and click to fix.",
        rect: "Rectangle: drag.", rrect: "Rounded rectangle: drag.",
        ellipse: "Ellipse: drag.", triangle: "Triangle: drag.",
        polygon: "Polygon: click each corner, double-click to close.",
        star: "Star: drag.", arrow: "Arrow: drag.", bubble: "Speech bubble: drag.",
        text: "Text: click to type.",
      };
      return hints[t] || "";
    }
    document.querySelectorAll("[data-tool]").forEach(function (btn) {
      btn.addEventListener("click", function () { setTool(btn.getAttribute("data-tool")); });
    });

    var sizeEl = document.getElementById("size"), sizeVal = document.getElementById("sizeVal");
    sizeEl.addEventListener("input", function () { size = Number(sizeEl.value); sizeVal.textContent = size; });
    var tolEl = document.getElementById("tol"), tolVal = document.getElementById("tolVal");
    tolEl.addEventListener("input", function () { tolerance = Number(tolEl.value); tolVal.textContent = tolerance; });
    document.getElementById("op").addEventListener("change", function (e) { op = e.target.value; });

    document.getElementById("colorP").addEventListener("input", function (e) { colorP = e.target.value; });
    document.getElementById("colorS").addEventListener("input", function (e) { colorS = e.target.value; });

    // Paint's palette: left click sets primary, right click sets secondary.
    var SWATCHES = ["#000000", "#7f7f7f", "#880015", "#ed1c24", "#ff7f27", "#fff200", "#22b14c", "#00a2e8",
                    "#3f48cc", "#a349a4", "#ffffff", "#c3c3c3", "#b97a57", "#ffaec9", "#ffc90e", "#efe4b0",
                    "#b5e61d", "#99d9ea", "#7092be", "#c8bfe7", "#ffd40d", "#141414"];
    (function buildPalette() {
      var host = document.getElementById("palette");
      SWATCHES.forEach(function (c) {
        var b = document.createElement("button");
        b.style.background = c;
        b.title = c + " — left click primary, right click secondary";
        b.addEventListener("click", function () { colorP = c; document.getElementById("colorP").value = c; });
        b.addEventListener("contextmenu", function (e) {
          e.preventDefault(); colorS = c; document.getElementById("colorS").value = c;
        });
        host.appendChild(b);
      });
    })();

    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("redo").addEventListener("click", redo);
    document.getElementById("del").addEventListener("click", deleteSelected);
    function deleteSelected() {
      if (!selectedStroke) { setStatus("Select a mark first (Select tool), then Delete."); return; }
      snapshot();
      doc.strokes = doc.strokes.filter(function (x) { return x.id !== selectedStroke; });
      // Notes anchored to a deleted mark keep their fallback position, so the
      // comment survives the mark it described.
      doc.strokes.forEach(function (x) { if (x.anchor === selectedStroke) x.anchor = null; });
      selectedStroke = null;
      paint(); setStatus("Deleted."); autoSave();
    }

    window.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelected(); return; }
      var meta = e.metaKey || e.ctrlKey;
      if (meta) {
        if (e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
        else if ((e.key === "z" && e.shiftKey) || e.key === "y") { e.preventDefault(); redo(); }
        return;
      }
      if (e.key === "Enter" && polyDraft) { e.preventDefault(); closePolygon(); return; }
      if (e.key === "Escape") {
        if (polyDraft) { polyDraft = null; draft = null; paint(); return; }
        if (curvePending) { curvePending = null; draft = null; paint(); return; }
      }
      var keys = { s: "select", p: "pencil", b: "brush", e: "eraser", f: "fill", i: "picker", a: "airbrush",
                   l: "line", c: "curve", r: "rect", o: "ellipse", v: "triangle", y: "polygon",
                   t: "text", "5": "star", "6": "bubble", "9": "arrow" };
      if (e.shiftKey && e.key === "R") { setTool("rrect"); return; }
      var t = keys[e.key.toLowerCase()];
      if (t) { e.preventDefault(); setTool(t); }
    });

    document.getElementById("clear").addEventListener("click", function () {
      if (!confirm("Clear the whole canvas? Everything on it is removed (undo still works).")) return;
      snapshot();
      doc.strokes = []; clearRaster(); selectedStroke = null;
      paint(); setStatus("Canvas cleared."); autoSave();
    });

    function setStatus(t) { statusEl.textContent = t; }

    // ── flatten for the model, and for PNG/JPG export ─────────────────
    // Board layering on screen is: paper → pixels → vector marks → images (DOM wraps).
    // Export in exactly that order at 1:1, so the PNG is the board, not a re-drawing.
    function renderBoard(scale, type) {
      var s = scale === undefined ? 1 : scale;
      var out = document.createElement("canvas");
      out.width = Math.max(1, Math.round(doc.w * s));
      out.height = Math.max(1, Math.round(doc.h * s));
      var c = out.getContext("2d");
      c.setTransform(s, 0, 0, s, 0, 0);
      c.fillStyle = type === "image/jpeg" ? "#ffffff" : doc.bg;
      c.fillRect(0, 0, doc.w, doc.h);
      if (rasterCv) c.drawImage(rasterCv, 0, 0, doc.w, doc.h);
      c.save(); c.beginPath(); c.rect(0, 0, doc.w, doc.h); c.clip();
      doc.strokes.forEach(function (st) { drawMark(c, st, false); });
      c.restore();
      var pending = doc.images.map(function (im) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () { c.drawImage(img, im.x, im.y, im.w, im.h); resolve(); };
          img.onerror = function () { resolve(); };
          img.src = im.url;
        });
      });
      return Promise.all(pending).then(function () { return out.toDataURL(type || "image/png", 0.92); });
    }
    function flatten() {
      // The model gets a sane size, not a 4K plate.
      var s = Math.min(1, 1280 / Math.max(doc.w, 1));
      return renderBoard(s, "image/png");
    }

    // The provider only accepts inline images, so an existing render has to be read
    // back and inlined before it can be the reference for the next one.
    function toDataUrl(url) {
      return fetch(url, { credentials: "same-origin" })
        .then(function (r) { return r.blob(); })
        .then(function (b) {
          return new Promise(function (resolve, reject) {
            var fr = new FileReader();
            fr.onload = function () { resolve(String(fr.result)); };
            fr.onerror = reject;
            fr.readAsDataURL(b);
          });
        });
    }

    document.getElementById("save").addEventListener("click", function () {
      if (!jobId) { setStatus("This board is not attached to a project yet — Create once and it will be."); return; }
      clearTimeout(saveTimer);
      flushSave();
      setStatus("Board saved.");
    });

    // The vector marks are already vectors — {tool, colour, width, points} — so an SVG
    // export is a serialiser, not a re-render. Pixel-tool work and images stay out on
    // purpose: they are bitmaps and inlining them produces a huge non-scalable file.
    function svgText() {
      var pad = 2;
      var parts = [];
      function esc(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      doc.strokes.forEach(function (st) {
        var c = st.color || "#ffd40d";
        var w = st.width || 3;
        var fc = st.fillColor || "none";
        if (st.tool === "pencil" || st.tool === "brush") {
          if (!st.points || !st.points.length) return;
          var d = st.points.map(function (p, i) { return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ");
          parts.push('<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w +
            '" stroke-linecap="' + (st.tool === "pencil" ? "butt" : "round") + '" stroke-linejoin="round"/>');
        } else if (st.tool === "text") {
          var fs = st.size || 20;
          parts.push('<text x="' + st.x1 + '" y="' + (st.y1 + fs * 0.85) + '" fill="' + c +
            '" font-family="' + esc(st.font || "Inter, Segoe UI, sans-serif") + '" font-size="' + fs +
            '" font-weight="' + (st.bold ? 700 : 400) + '"' + (st.italic ? ' font-style="italic"' : "") +
            (st.underline ? ' text-decoration="underline"' : "") + ">" + esc(st.text || "") + "</text>");
        } else if (st.tool === "polygon") {
          parts.push('<polygon points="' + (st.points || []).map(function (p) { return p.x + "," + p.y; }).join(" ") +
            '" fill="' + fc + '" stroke="' + c + '" stroke-width="' + w + '"/>');
        } else if (st.tool === "line") {
          parts.push('<line x1="' + st.x1 + '" y1="' + st.y1 + '" x2="' + st.x2 + '" y2="' + st.y2 +
            '" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round"/>');
        } else if (st.tool === "arrow") {
          parts.push('<line x1="' + st.x1 + '" y1="' + st.y1 + '" x2="' + st.x2 + '" y2="' + st.y2 +
            '" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round"/>');
          var a = Math.atan2(st.y2 - st.y1, st.x2 - st.x1), h = Math.max(10, w * 3);
          var p1 = [st.x2 - h * Math.cos(a - 0.42), st.y2 - h * Math.sin(a - 0.42)];
          var p2 = [st.x2 - h * Math.cos(a + 0.42), st.y2 - h * Math.sin(a + 0.42)];
          parts.push('<polygon points="' + st.x2 + ',' + st.y2 + " " + p1[0] + "," + p1[1] + " " +
            p2[0] + "," + p2[1] + '" fill="' + c + '"/>');
        } else if (st.tool === "rect" || st.tool === "rrect") {
          var x = Math.min(st.x1, st.x2), y = Math.min(st.y1, st.y2);
          var rw = Math.abs(st.x2 - st.x1), rh = Math.abs(st.y2 - st.y1);
          var rx = st.tool === "rrect" ? Math.min(20, Math.min(rw, rh) / 4) : 0;
          parts.push('<rect x="' + x + '" y="' + y + '" width="' + rw + '" height="' + rh + '" rx="' + rx +
            '" fill="' + (st.op === "fill" || st.fillColor ? fc : "none") + '" stroke="' +
            (st.op === "fill" ? "none" : c) + '" stroke-width="' + w + '"/>');
        } else if (st.tool === "ellipse") {
          parts.push('<ellipse cx="' + (st.x1 + st.x2) / 2 + '" cy="' + (st.y1 + st.y2) / 2 + '" rx="' +
            Math.abs(st.x2 - st.x1) / 2 + '" ry="' + Math.abs(st.y2 - st.y1) / 2 + '" fill="' +
            (st.fillColor || "none") + '" stroke="' + (st.op === "fill" ? "none" : c) + '" stroke-width="' + w + '"/>');
        }
      });
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + Math.round(doc.w) +
        '" height="' + Math.round(doc.h) + '" viewBox="0 0 ' + Math.round(doc.w) +
        " " + Math.round(doc.h) + '">' +
        '<rect width="100%" height="100%" fill="' + doc.bg + '"/>' + parts.join("") + "</svg>";
    }

    document.getElementById("svg").addEventListener("click", function () {
      if (!doc.strokes.length) { setStatus("Nothing drawn yet — pixel-tool work does not go into SVG."); return; }
      var blob = new Blob([svgText()], { type: "image/svg+xml" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sketch-" + Date.now() + ".svg";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      setStatus("SVG exported — " + doc.strokes.length + " vector marks (pixels and images excluded).");
    });

    document.getElementById("shot").addEventListener("click", function () {
      renderBoard(1, "image/png").then(function (url) {
        var a = document.createElement("a");
        a.href = url; a.download = "sketch-" + Date.now() + ".png"; a.click();
      });
    });

    document.getElementById("create").addEventListener("click", function () {
      var prompt = (promptEl.value || "").trim();
      if (!prompt) { setStatus("Describe what to create first."); promptEl.focus(); return; }
      var btn = document.getElementById("create");
      btn.disabled = true;
      var iterate = document.getElementById("iterate").checked && !!lastRenderUrl;
      setStatus(iterate ? "Creating — using the last render as the reference…" : "Creating — flattening the board…");
      (iterate ? toDataUrl(lastRenderUrl) : flatten()).then(function (composite) {
        setStatus("Creating — the model is working…");
        // Create is the other moment a board becomes a project: without an id the
        // render lands as an asset no job claims.
        return ensureJob().then(function (id) {
          var body = {
            action: "render",
            prompt: prompt + (iterate
              ? "\n\nThe attached image is the PREVIOUS render of this board. Change it as instructed and keep everything the instruction does not mention."
              : "\n\nThe attached image is the owner's board: placed images plus hand-drawn marks, arrows and notes showing what belongs where and how it moves. Honour the layout, the connections and the annotations."),
            refs: [composite],
            jobId: id,
          };
          return fetch("/api/buzzy/art", {
            method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
        });
      }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) {
          setStatus(res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "") : (res.d.error || "Could not create."));
          return;
        }
        var img = res.d.image;
        lastRenderUrl = img.url;
        setStatus("Done in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — added to the board and to the project.");
        var box = document.getElementById("result");
        box.style.display = "block";
        document.getElementById("resultImg").src = img.url;
        document.getElementById("resultLink").href = img.url;
        addImage(img.url, { x: 60 + doc.images.length * 18, y: 60 + doc.images.length * 18 });
      }).catch(function (e) {
        btn.disabled = false;
        setStatus("Failed: " + e.message);
      });
    });

    // ── region edit ───────────────────────────────────────────────────
    // A change to one part of a finished picture. The mask is a PNG at the picture's
    // natural size: black everywhere, white where the owner dragged. Sending the
    // picture + mask + instruction is what keeps the rest of the frame from being
    // re-rolled, which is the difference between an edit and a fresh guess.
    (function initRegionEdit() {
      var overlay = document.getElementById("regionOverlay");
      var rectEl = document.getElementById("regionRect");
      var img = document.getElementById("resultImg");
      var box = document.getElementById("result");
      var input = document.getElementById("regionPrompt");
      var btn = document.getElementById("regionApply");
      var note = document.getElementById("regionStatus");
      var dragStart = null;
      var picked = null;   // {x,y,w,h} in CSS pixels relative to the picture

      function syncOverlay() {
        if (!lastRenderUrl) { overlay.classList.remove("on"); return; }
        var r = img.getBoundingClientRect();
        var b = box.getBoundingClientRect();
        overlay.style.left = (r.left - b.left) + "px";
        overlay.style.top = (r.top - b.top) + "px";
        overlay.style.width = r.width + "px";
        overlay.style.height = r.height + "px";
        overlay.classList.add("on");
      }

      overlay.addEventListener("mousedown", function (e) {
        var r = overlay.getBoundingClientRect();
        dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
        rectEl.style.display = "block";
        rectEl.style.left = dragStart.x + "px";
        rectEl.style.top = dragStart.y + "px";
        rectEl.style.width = "0px";
        rectEl.style.height = "0px";
        e.preventDefault();
      });
      overlay.addEventListener("mousemove", function (e) {
        if (!dragStart) return;
        var r = overlay.getBoundingClientRect();
        var x = Math.max(0, Math.min(r.width, e.clientX - r.left));
        var y = Math.max(0, Math.min(r.height, e.clientY - r.top));
        var x0 = Math.min(x, dragStart.x), y0 = Math.min(y, dragStart.y);
        rectEl.style.left = x0 + "px"; rectEl.style.top = y0 + "px";
        rectEl.style.width = Math.abs(x - dragStart.x) + "px";
        rectEl.style.height = Math.abs(y - dragStart.y) + "px";
      });
      overlay.addEventListener("mouseup", function (e) {
        if (!dragStart) return;
        var r = overlay.getBoundingClientRect();
        var x = Math.max(0, Math.min(r.width, e.clientX - r.left));
        var y = Math.max(0, Math.min(r.height, e.clientY - r.top));
        picked = {
          x: Math.min(x, dragStart.x), y: Math.min(y, dragStart.y),
          w: Math.abs(x - dragStart.x), h: Math.abs(y - dragStart.y),
          scaleX: img.naturalWidth / r.width, scaleY: img.naturalHeight / r.height,
        };
        dragStart = null;
        if (picked.w < 8 || picked.h < 8) { picked = null; note.textContent = "That box is too small — drag a wider area."; return; }
        note.textContent = Math.round(picked.w) + "×" + Math.round(picked.h) + " selected. Describe the change.";
        input.focus();
      });

      window.addEventListener("resize", syncOverlay);
      img.addEventListener("load", syncOverlay);

      function maskDataUrl() {
        var w = img.naturalWidth, h = img.naturalHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#fff";
        g.fillRect(picked.x * picked.scaleX, picked.y * picked.scaleY, picked.w * picked.scaleX, picked.h * picked.scaleY);
        return c.toDataURL("image/png");
      }

      btn.addEventListener("click", function () {
        var instruction = (input.value || "").trim();
        if (!lastRenderUrl) { note.textContent = "Create a picture first, then change part of it."; return; }
        if (!picked) { note.textContent = "Drag a box on the picture first."; return; }
        if (!instruction) { input.focus(); note.textContent = "Say what should change inside the box."; return; }
        var imageId = Number(String(lastRenderUrl).split("/").pop());
        btn.disabled = true;
        note.textContent = "Changing that area…";
        fetch("/api/buzzy/art", {
          method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "edit", jobId: jobId || undefined, imageId: imageId, mask: maskDataUrl(), instruction: instruction }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.ok) {
              note.textContent = res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "")
                : "Could not change it: " + (res.d.error || "unknown");
              return;
            }
            lastRenderUrl = res.d.image.url;
            img.src = res.d.image.url;
            document.getElementById("resultLink").href = res.d.image.url;
            addImage(res.d.image.url, { x: 60 + doc.images.length * 18, y: 60 + doc.images.length * 18 });
            picked = null;
            rectEl.style.display = "none";
            note.textContent = "Changed in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — saved to this project.";
            flushSave();
          })
          .catch(function (e) { btn.disabled = false; note.textContent = "Failed: " + e.message; });
      });
    })();

    // ── load the saved board ──────────────────────────────────────────
    function load() {
      if (!jobId) { fitDoc(); return; }
      // The board belongs to a project; show the project's name, not "New board".
      fetch("/api/buzzy/projects/" + encodeURIComponent(jobId), { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (p) {
          var t = p && p.project && p.project.title ? String(p.project.title) : "";
          if (t) {
            titleEl.textContent = t;
            document.title = t + " — BeeZilla Sketch";
          }
        })
        .catch(function () {});
      fetch("/api/buzzy/art?job=" + encodeURIComponent(jobId), { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.board) {
            if (d.board.w && d.board.h) { doc.w = d.board.w; doc.h = d.board.h; }
            if (d.board.bg) doc.bg = d.board.bg;
            doc.strokes = d.board.strokes || [];
            doc.images = d.board.images || [];
            doc.raster = d.board.raster || null;
          }
          if (d && d.images && d.images.length) {
            var last = d.images[d.images.length - 1];
            lastRenderUrl = last.url;
            var box = document.getElementById("result");
            box.style.display = "block";
            document.getElementById("resultImg").src = last.url;
            document.getElementById("resultLink").href = last.url;
          }
          if (!doc.w || doc.w < 2) fitDoc();
          ensureRaster();
          loadRaster(doc.raster);
          renderImages();
          paint();
        })
        .catch(function () { fitDoc(); });
    }

    // Canvas size follows the stage on a brand-new board, once, after layout settles.
    function fitDoc() {
      var r = stage.getBoundingClientRect();
      doc.w = Math.max(200, Math.round(r.width));
      doc.h = Math.max(200, Math.round(r.height));
      rasterCv = null;
      ensureRaster();
      paint();
    }

    // A board with no project gets one when the owner first PUTS something on it —
    // never on page load. Opening Sketch used to POST a new job_art_… every time the
    // nav sent you here, so a lap of the site left a heap of empty "Sketch board"
    // projects (BZ-13, Nov 2026). One promise, so a burst of strokes still makes one.
    var jobPromise = null;
    function ensureJob() {
      if (jobId) return Promise.resolve(jobId);
      if (jobPromise) return jobPromise;
      var id = "job_art_" + Date.now().toString(36);
      // POST /api/buzzy/jobs is the upsert (a PUT to /jobs/<id> is a 404 — the
      // route does not exist, and a board with nowhere to land orphans its render).
      jobPromise = fetch("/api/buzzy/jobs", {
        method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: id, title: "Sketch board", status: "In progress", data: {} }),
      }).then(function (r) {
        if (!r.ok) throw new Error("could not open a board");
        jobId = id;
        history.replaceState({}, "", "/buzzy/sketch?job=" + encodeURIComponent(id));
        setStatus("New board ready. Drop images, draw, then Create.");
        return id;
      }).catch(function (e) {
        // One failed attempt must not become one POST per brush stroke: retry on a
        // later mark, not on every mark.
        setTimeout(function () { jobPromise = null; }, 5000);
        throw e;
      });
      return jobPromise;
    }
    if (!jobId) titleEl.textContent = "New board";
    window.addEventListener("resize", paint);
    // A stage that changes size without a window resize (nav rows wrapping, fonts
    // landing, #bzPage gaining its flex on a soft hop) must re-measure the backing
    // store, or the canvas keeps the size it guessed at parse time.
    if (window.ResizeObserver) new ResizeObserver(function () { paint(); }).observe(stage);
    load();
  })();
</script>
</body>
</html>
