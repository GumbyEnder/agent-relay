<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeeZilla — Sketch</title>
<link rel="stylesheet" href="/buzzy/nav.css" />
<style>
  :root { --bz-bg:#0d0d0d; --bz-card:#151515; --bz-line:#242424; --bz-yellow:#ffd40d;
          --bz-text:#f2f2f2; --bz-muted:#8d8d8d; --bz-good:#6ee7a8; --bz-bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bz-bg); color:var(--bz-text); height:100vh; display:flex; flex-direction:column;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow:hidden; }
  header { padding: 0.7rem 1rem 0.4rem; border-bottom: 1px solid var(--bz-line); }
  #bzNav { display:flex; flex-wrap:wrap; gap:0.9rem; padding-bottom:0.5rem; }
  #bzNav a { color:var(--bz-muted); text-decoration:none; font-size:0.84rem; }
  #bzNav a[data-nav="sketch"] { color: var(--bz-yellow); }
  .row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .title { font-weight:600; font-size:0.95rem; margin-right:auto; }
  input[type="text"] { background:#101010; border:1px solid var(--bz-line); color:var(--bz-text);
                       border-radius:8px; padding:0.35rem 0.55rem; font-size:0.86rem; }
  button { background:#1b1b1b; color:var(--bz-text); border:1px solid var(--bz-line); border-radius:8px;
           padding:0.35rem 0.65rem; font-size:0.82rem; cursor:pointer; }
  button:hover { border-color:#3a3a3a; }
  button.on { background:var(--bz-yellow); color:#111; border-color:var(--bz-yellow); font-weight:600; }
  button.primary { background:var(--bz-yellow); color:#111; font-weight:600; border-color:var(--bz-yellow); }
  button:disabled { opacity:0.5; cursor:default; }
  #stage { position:relative; flex:1; overflow:hidden; background:#141414; }
  /* nav.js moves body's children into #bzPage on the first soft hop, so #stage stops
     being a flex item of body and `flex:1` resolves against an auto-height block:
     the canvas collapsed to its content height (~83px) while a hard load looked fine.
     This rule travels with this page's stylesheet, which the shell enables only while
     Sketch is the active page. */
  #bzPage { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  #board { position:absolute; inset:0; touch-action:none; }
  #layers { position:absolute; inset:0; pointer-events:none; }
  .img-wrap { position:absolute; pointer-events:auto; cursor:move; border:1px solid transparent; }
  .img-wrap.selected { border-color: var(--bz-yellow); }
  .img-wrap img { width:100%; height:100%; object-fit:fill; display:block; user-select:none; -webkit-user-drag:none; }
  .img-wrap .handle { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:var(--bz-yellow);
                      border-radius:2px; cursor:nwse-resize; pointer-events:auto; }
  footer { border-top:1px solid var(--bz-line); padding:0.6rem 1rem; display:flex; gap:0.6rem; align-items:center; }
  #status { color:var(--bz-muted); font-size:0.8rem; }
  /* The closing brace used to sit at the end of the first declaration, so every rule
     after it (`position:absolute; … display:none`) was dropped: the panel rendered on
     every visit, over the canvas, with no render behind it. */
  #result { position:absolute; right:12px; top:12px; width:210px; background:var(--bz-card); border:1px solid var(--bz-line);
            border-radius:12px; padding:0.6rem; display:none; }
  #result img { width:100%; border-radius:8px; display:block; }
  #result a { color:var(--bz-yellow); font-size:0.8rem; text-decoration:none; display:inline-block; margin-top:0.4rem; }
  .hint { color:var(--bz-muted); font-size:0.78rem; }
  .drop { outline:2px dashed var(--bz-yellow); outline-offset:-8px; }

  #regionOverlay { position: absolute; inset: 0; cursor: crosshair; display: none; }
  #regionOverlay.on { display: block; }
  #regionRect { position: absolute; border: 2px dashed #ffd40d; background: rgba(255,212,13,0.16); display: none; }
  #regionPanel { display: flex; gap: 0.45rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
  #regionPanel input { flex: 1; min-width: 220px; }
</style>
</head>
<body>
<header>
  <nav id="bzNav">
    <a href="/buzzy/talk" data-nav="talk">Talk</a>
    <a href="/buzzy/sketch" data-nav="sketch">Sketch</a>
    <a href="/buzzy/studio" data-nav="studio">Studio</a>
    <a href="/buzzy/library" data-nav="library">Library</a>
    <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
    <a href="/buzzy/memory" data-nav="memory">Memory</a>
    <a href="/buzzy/experts" data-nav="experts">Experts</a>
    <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
    <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
    <a href="/buzzy/upload" data-nav="publish">Publish</a>
  </nav>
  <div class="row">
    <span class="title" id="pTitle">Untitled board</span>
    <button data-tool="select" class="on">Select</button>
    <button data-tool="pen">Brush</button>
    <button data-tool="line">Line</button>
    <button data-tool="arrow">Arrow</button>
    <button data-tool="rect">Box</button>
    <button data-tool="text">Note</button>
    <input id="color" type="color" value="#ffd40d" title="Colour" style="width:34px;height:30px;background:none;border:1px solid var(--bz-line);border-radius:8px" />
    <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button id="clear">Clear drawing</button>
    <button id="save">Save</button>
    <span id="savedFlag" style="font-size:.76rem;align-self:center"></span>
    <button id="shot" title="Download a PNG of the board">Export PNG</button>
    <button id="svg" title="Download the drawing as vector SVG (images are not included)">Export SVG</button>
  </div>
</header>

<div id="stage">
  <canvas id="board"></canvas>
  <div id="layers"></div>
  <div id="result">
    <img id="resultImg" alt="" />
    <!-- Region edit: drag a box on the picture, say what should change inside it.
         The mask is drawn here, at the picture's own size, so the server never has
         to guess which pixels the owner meant. -->
    <div id="regionOverlay" title="Drag to mark the area to change"><div id="regionRect"></div></div>
    <div id="regionPanel">
      <input id="regionPrompt" type="text" placeholder="What should change inside the box? e.g. 'make the coat red'" />
      <button class="primary" id="regionApply">Change this area</button>
      <span class="hint" id="regionStatus">Drag a box on the picture, then describe the change.</span>
    </div>
    <a id="resultLink" href="#" download>Download</a>
  </div>
</div>

<footer>
  <input id="prompt" type="text" style="flex:1" placeholder="Describe what to create — e.g. 'a red car driving along the road I drew, evening light'" />
  <label class="hint" style="display:flex;align-items:center;gap:0.35rem" title="Send the last rendered picture as the reference instead of the board">
    <input type="checkbox" id="iterate" /> Iterate from last render
  </label>
  <button class="primary" id="create">Create</button>
  <span id="status">Drop or paste images, draw between them, then Create.</span>
</footer>

<script>
  // The board is an ordered set of things the owner placed: images they dropped,
  // strokes they drew, and notes. "Create" flattens the whole thing into one
  // reference image and asks the model to produce the result — so connecting a car
  // to a road IS the instruction, not a description of one.
  (function () {
    var jobId = new URLSearchParams(location.search).get("job");
    var stage = document.getElementById("stage");
    var canvas = document.getElementById("board");
    var layers = document.getElementById("layers");
    var ctx = canvas.getContext("2d");
    var statusEl = document.getElementById("status");
    var promptEl = document.getElementById("prompt");
    var titleEl = document.getElementById("pTitle");

    var tool = "select";
    var color = "#ffd40d";
    var strokes = [];        // {tool, color, width, points:[{x,y}] | x,y,w,h | text}
    var images = [];         // {id,url,x,y,w,h}
    var selected = null;
    // Undo is a stack of board snapshots, not a pile of per-tool inverses: strokes,
    // images and their positions are one document, so one snapshot restores all of it.
    var lastRenderUrl = null;   // the newest rendered picture on this board
    var undoStack = [];
    var redoStack = [];
    function snapshot() {
      undoStack.push(JSON.stringify({ strokes: strokes, images: images }));
      if (undoStack.length > 50) undoStack.shift();
      redoStack.length = 0;
      // The first mark is the moment this board becomes a project; a page you
      // merely looked at is not one.
      ensureJob().then(autoSave, function () { /* a scratch board that cannot be saved is not an error toast */ });
    }

    // The board IS the input of this project, so it is written back without being
    // asked. Relying on the Save button meant a session of work could live only in
    // the tab — /buzzy/sketch?job=… then opened an empty project.
    var saveTimer = null, saving = false, saveAgain = false;
    function autoSave() {
      if (!jobId) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { flushSave(); }, 1200);
    }
    function flushSave() {
      if (!jobId) return;
      if (saving) { saveAgain = true; return; }
      saving = true;
      fetch("/api/buzzy/art", {
        method: "POST", credentials: "same-origin", keepalive: true,
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "save", jobId: jobId, board: boardJson() }),
      }).then(function (r) { if (!r.ok) throw new Error("save failed"); setSaved(true); })
        .catch(function () { setSaved(false); })
        .then(function () {
          saving = false;
          if (saveAgain) { saveAgain = false; flushSave(); }
        });
    }
    function setSaved(ok) {
      var el = document.getElementById("savedFlag");
      if (!el) return;
      el.textContent = ok ? "Saved to project" : "Not saved — retrying";
      el.style.color = ok ? "#6ee7a8" : "#ff6b6b";
      if (ok) { clearTimeout(el._t); el._t = setTimeout(function () { el.textContent = ""; }, 2500); }
    }
    window.addEventListener("pagehide", function () { if (jobId) flushSave(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });
    function applySnapshot(json) {
      var d = JSON.parse(json);
      strokes = d.strokes || [];
      images = d.images || [];
      renderImages();
      redraw();
    }
    function undo() {
      if (!undoStack.length) { setStatus("Nothing to undo."); return; }
      redoStack.push(JSON.stringify({ strokes: strokes, images: images }));
      applySnapshot(undoStack.pop());
      setStatus("Undone.");
    }
    function redo() {
      if (!redoStack.length) { setStatus("Nothing to redo."); return; }
      undoStack.push(JSON.stringify({ strokes: strokes, images: images }));
      applySnapshot(redoStack.pop());
      setStatus("Redone.");
    }
    var drag = null;
    var draft = null;
    var scale = 1;           // canvas pixels per CSS pixel

    function resize() {
      var r = stage.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      // The canvas BOX is CSS-owned (#board { inset:0 } inside #stage). Pinning
      // style.width/height from a rect measured at parse time froze the box at whatever
      // the stage measured before layout settled — 1034.6px against a 909.6px stage on a
      // soft hop (this page's scripts run before #bzPage's flex applies), 979px against
      // 910px on a hard load. #stage's overflow:hidden then clips the difference: the
      // drawing surface is silently bigger than the board, its bottom cannot be reached,
      // and the board's coordinate space depends on when the measurement ran (measure too
      // early in the other direction and you get a dead strip below the canvas, which is
      // BZ-26's collapse at its extreme). Only the backing store follows the measurement;
      // ResizeObserver re-measures once layout settles (see the listener at the bottom).
      var w = Math.max(1, Math.round(r.width * dpr));
      var h = Math.max(1, Math.round(r.height * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      scale = dpr;
      redraw();
    }

    function newId() { return "s_" + Math.random().toString(36).slice(2, 9); }

    // A note belongs to a mark, not to a coordinate: "this road is too narrow" must
    // stay attached to the road when the drawing around it moves. Anchor = stroke id;
    // the note's own x1/y1 is only a fallback for marks that no longer exist.
    function anchorPoint(id) {
      var st = null;
      for (var i = 0; i < strokes.length; i++) if (strokes[i].id === id) { st = strokes[i]; break; }
      if (!st) return null;
      if (st.tool === "pen" && st.points && st.points.length) {
        var p = st.points[Math.floor(st.points.length / 2)];
        return { x: p.x, y: p.y - 12 };
      }
      if (st.tool === "text") return null;
      return { x: (st.x1 + st.x2) / 2, y: (st.y1 + st.y2) / 2 - 12 };
    }

    // Which mark is under the cursor? Cheap segment distance is enough for selecting.
    function hitTest(p) {
      var best = null, bestD = 9;
      strokes.forEach(function (st) {
        if (st.tool === "text") {
          if (Math.abs(p.x - st.x1) < 80 && Math.abs(p.y - st.y1) < 14) { best = st; bestD = 0; }
          return;
        }
        if (st.tool === "pen" && st.points) {
          for (var i = 1; i < st.points.length; i++) {
            var d = segDist(p, st.points[i - 1], st.points[i]);
            if (d < bestD) { bestD = d; best = st; }
          }
        } else {
          var d2 = segDist(p, { x: st.x1, y: st.y1 }, { x: st.x2, y: st.y2 });
          if (d2 < bestD) { bestD = d2; best = st; }
          if (st.tool === "rect") {
            var corners = [[st.x1, st.y1, st.x2, st.y1], [st.x2, st.y1, st.x2, st.y2],
                           [st.x2, st.y2, st.x1, st.y2], [st.x1, st.y2, st.x1, st.y1]];
            corners.forEach(function (c) {
              var dd = segDist(p, { x: c[0], y: c[1] }, { x: c[2], y: c[3] });
              if (dd < bestD) { bestD = dd; best = st; }
            });
          }
        }
      });
      return best;
    }
    function segDist(p, a, b) {
      var vx = b.x - a.x, vy = b.y - a.y;
      var wx = p.x - a.x, wy = p.y - a.y;
      var len2 = vx * vx + vy * vy;
      var t = len2 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2)) : 0;
      var dx = p.x - (a.x + t * vx), dy = p.y - (a.y + t * vy);
      return Math.sqrt(dx * dx + dy * dy);
    }

    function redraw() {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(function (s) { drawStroke(s, false); });
      if (draft) drawStroke(draft, true);
    }

    function drawStroke(s, isDraft) {
      ctx.strokeStyle = s.color || color;
      ctx.fillStyle = s.color || color;
      ctx.lineWidth = s.width || 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.setLineDash(isDraft ? [6, 4] : []);
      if (s.id && s.id === selectedStroke) {
        ctx.lineWidth = (s.width || 3) + 6;
        ctx.strokeStyle = "rgba(255,212,13,0.25)";
        ctx.beginPath();
        if (s.tool === "pen" && s.points) { ctx.moveTo(s.points[0].x, s.points[0].y);
          for (var i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y); }
        else if (s.tool !== "text") { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
        ctx.stroke();
        ctx.lineWidth = s.width || 3;
      }
      if (s.tool === "pen") {
        if (!s.points.length) return;
        ctx.beginPath();
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (var i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
        ctx.stroke();
      } else if (s.tool === "line" || s.tool === "arrow") {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        if (s.tool === "arrow") {
          var a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          var head = 12;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - head * Math.cos(a - 0.4), s.y2 - head * Math.sin(a - 0.4));
          ctx.lineTo(s.x2 - head * Math.cos(a + 0.4), s.y2 - head * Math.sin(a + 0.4));
          ctx.closePath();
          ctx.fill();
        }
      } else if (s.tool === "rect") {
        ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
      } else if (s.tool === "text") {
        var at = (s.anchor && anchorPoint(s.anchor)) || { x: s.x1, y: s.y1 };
        ctx.font = "600 15px -apple-system, Segoe UI, Inter, sans-serif";
        ctx.fillText(s.text || "", at.x, at.y);
        if (s.anchor) { ctx.beginPath(); ctx.arc(at.x - 6, at.y - 4, 2.5, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.setLineDash([]);
    }

    function pt(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    var selectedStroke = null;
    canvas.addEventListener("pointerdown", function (e) {
      if (tool === "select") {
        var hit = hitTest(pt(e));
        selectedStroke = hit ? hit.id : null;
        redraw();
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      var p = pt(e);
      if (tool === "text") {
        var t = window.prompt("Note:");
        if (t) {
          snapshot();
          // Clicking a mark anchors the note to it; clicking empty space leaves it free.
          var hit = hitTest(p);
          strokes.push({ id: newId(), tool: "text", color: color, x1: p.x, y1: p.y, text: t,
                         anchor: hit ? hit.id : null });
          redraw();
          setStatus(hit ? "Note attached to that mark." : "Note added.");
        }
        return;
      }
      snapshot();
      draft = tool === "pen"
        ? { tool: "pen", color: color, width: 3, points: [p] }
        : { tool: tool, color: color, width: 3, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      redraw();
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!draft) return;
      var p = pt(e);
      if (draft.tool === "pen") draft.points.push(p);
      else { draft.x2 = p.x; draft.y2 = p.y; }
      redraw();
    });
    canvas.addEventListener("pointerup", function () {
      if (!draft) return;
      draft.id = newId();
      strokes.push(draft);
      draft = null;
      redraw();
      setStatus(strokes.length + " marks on the board");
    });

    // ── images: drop, paste, move, resize ─────────────────────────────
    function addImage(url, at) {
      var w = 240, h = 160;
      var img = new Image();
      img.onload = function () {
        var ratio = img.naturalHeight / img.naturalWidth || 0.66;
        h = Math.round(w * ratio);
        place(url, at, w, h);
      };
      img.onerror = function () { place(url, at, w, h); };
      img.src = url;
    }
    function place(url, at, w, h) {
      snapshot();
      var item = { id: "im_" + Math.random().toString(36).slice(2, 9), url: url, x: at.x, y: at.y, w: w, h: h };
      images.push(item);
      renderImages();
    }
    function renderImages() {
      layers.innerHTML = "";
      images.forEach(function (im) {
        var wrap = document.createElement("div");
        wrap.className = "img-wrap" + (selected === im.id ? " selected" : "");
        wrap.style.left = im.x + "px";
        wrap.style.top = im.y + "px";
        wrap.style.width = im.w + "px";
        wrap.style.height = im.h + "px";
        wrap.setAttribute("data-id", im.id);
        var img = document.createElement("img");
        img.src = im.url;
        img.alt = "";
        var handle = document.createElement("div");
        handle.className = "handle";
        wrap.appendChild(img);
        wrap.appendChild(handle);
        wrap.addEventListener("pointerdown", function (e) {
          if (tool !== "select") return;
          e.stopPropagation();
          selected = im.id;
          drag = { id: im.id, mode: e.target === handle ? "resize" : "move", sx: e.clientX, sy: e.clientY, ox: im.x, oy: im.y, ow: im.w, oh: im.h };
          renderImages();
        });
        layers.appendChild(wrap);
      });
    }
    window.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var im = images.find(function (x) { return x.id === drag.id; });
      if (!im) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (drag.mode === "move") { im.x = drag.ox + dx; im.y = drag.oy + dy; }
      else { im.w = Math.max(40, drag.ow + dx); im.h = Math.max(40, drag.oh + dy); }
      renderImages();
    });
    window.addEventListener("pointerup", function () { drag = null; });

    stage.addEventListener("dragover", function (e) { e.preventDefault(); stage.classList.add("drop"); });
    stage.addEventListener("dragleave", function () { stage.classList.remove("drop"); });
    stage.addEventListener("drop", function (e) {
      e.preventDefault();
      stage.classList.remove("drop");
      var at = pt(e);
      for (const f of e.dataTransfer.files) {
        if (!f.type.startsWith("image/")) continue;
        var url = URL.createObjectURL(f);
        addImage(url, at);
      }
    });
    window.addEventListener("paste", function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type.indexOf("image") === 0) {
          var f = it.getAsFile();
          if (f) addImage(URL.createObjectURL(f), { x: 40 + images.length * 20, y: 40 + images.length * 20 });
        }
      }
    });

    document.querySelectorAll("[data-tool]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tool = btn.getAttribute("data-tool");
        document.querySelectorAll("[data-tool]").forEach(function (b) { b.classList.toggle("on", b === btn); });
      });
    });
    document.getElementById("color").addEventListener("input", function (e) { color = e.target.value; });
    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("redo").addEventListener("click", redo);
    window.addEventListener("keydown", function (e) {
      if (e.key === "Delete" || e.key === "Backspace") {
        if (tool === "select" && selectedStroke) {
          e.preventDefault();
          snapshot();
          strokes = strokes.filter(function (x) { return x.id !== selectedStroke; });
          // Notes anchored to a deleted mark keep their fallback position, so the
          // comment survives the mark it described.
          strokes.forEach(function (x) { if (x.anchor === selectedStroke) x.anchor = null; });
          selectedStroke = null;
          redraw();
          setStatus("Deleted.");
        }
        return;
      }
      var meta = e.metaKey || e.ctrlKey;
      if (!meta) return;
      if (e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((e.key === "z" && e.shiftKey) || e.key === "y") { e.preventDefault(); redo(); }
    });
    document.getElementById("clear").addEventListener("click", function () {
      if (!confirm("Clear every mark you drew? (images stay)")) return;
      snapshot();
      strokes = []; redraw();
    });

    function setStatus(t) { statusEl.textContent = t; }

    // ── flatten the board for the model ───────────────────────────────
    function flatten() {
      var r = stage.getBoundingClientRect();
      var out = document.createElement("canvas");
      var s = Math.min(1, 1280 / Math.max(r.width, 1));
      out.width = Math.round(r.width * s);
      out.height = Math.round(r.height * s);
      var c = out.getContext("2d");
      c.fillStyle = "#ffffff";
      c.fillRect(0, 0, out.width, out.height);
      var pending = images.map(function (im) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function () { c.drawImage(img, im.x * s, im.y * s, im.w * s, im.h * s); resolve(); };
          img.onerror = function () { resolve(); };
          img.src = im.url;
        });
      });
      return Promise.all(pending).then(function () {
        c.setTransform(s, 0, 0, s, 0, 0);
        strokes.forEach(function (st) {
          c.strokeStyle = st.color || color; c.fillStyle = st.color || color;
          c.lineWidth = st.width || 3; c.lineCap = "round"; c.lineJoin = "round";
          if (st.tool === "pen") { c.beginPath(); c.moveTo(st.points[0].x, st.points[0].y);
            for (var i = 1; i < st.points.length; i++) c.lineTo(st.points[i].x, st.points[i].y); c.stroke(); }
          else if (st.tool === "line" || st.tool === "arrow") { c.beginPath(); c.moveTo(st.x1, st.y1); c.lineTo(st.x2, st.y2); c.stroke();
            if (st.tool === "arrow") { var a = Math.atan2(st.y2 - st.y1, st.x2 - st.x1), h = 12;
              c.beginPath(); c.moveTo(st.x2, st.y2);
              c.lineTo(st.x2 - h * Math.cos(a - 0.4), st.y2 - h * Math.sin(a - 0.4));
              c.lineTo(st.x2 - h * Math.cos(a + 0.4), st.y2 - h * Math.sin(a + 0.4)); c.closePath(); c.fill(); } }
          else if (st.tool === "rect") { c.strokeRect(st.x1, st.y1, st.x2 - st.x1, st.y2 - st.y1); }
          else if (st.tool === "text") { c.font = "600 15px -apple-system, Segoe UI, Inter, sans-serif"; c.fillText(st.text || "", st.x1, st.y1); }
        });
        return out.toDataURL("image/png");
      });
    }

    // The provider only accepts inline images, so an existing render has to be read
    // back and inlined before it can be the reference for the next one.
    function toDataUrl(url) {
      return fetch(url, { credentials: "same-origin" })
        .then(function (r) { return r.blob(); })
        .then(function (b) {
          return new Promise(function (resolve, reject) {
            var fr = new FileReader();
            fr.onload = function () { resolve(String(fr.result)); };
            fr.onerror = reject;
            fr.readAsDataURL(b);
          });
        });
    }

    function boardJson() {
      return { version: 1, strokes: strokes, images: images.map(function (i) { return { x: i.x, y: i.y, w: i.w, h: i.h, url: i.url }; }) };
    }

    document.getElementById("save").addEventListener("click", function () {
      if (!jobId) { setStatus("This board is not attached to a project yet — Create once and it will be."); return; }
      clearTimeout(saveTimer);
      flushSave();
      setStatus("Board saved.");
    });

    // The drawing is already vectors — {tool, colour, width, points} — so an SVG
    // export is a serialiser, not a re-render. Images stay out on purpose: they are
    // bitmaps, and inlining them would produce a big file that is not scalable anyway.
    function svgText() {
      var r = stage.getBoundingClientRect();
      var pad = 2;
      var parts = [];
      function esc(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      strokes.forEach(function (st) {
        var c = st.color || "#ffd40d";
        var w = st.width || 3;
        if (st.tool === "pen" && st.points && st.points.length) {
          var d = st.points.map(function (p, i) { return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ");
          parts.push('<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w +
            '" stroke-linecap="round" stroke-linejoin="round"/>');
        } else if (st.tool === "line" || st.tool === "arrow") {
          parts.push('<line x1="' + st.x1 + '" y1="' + st.y1 + '" x2="' + st.x2 + '" y2="' + st.y2 +
            '" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round"/>');
          if (st.tool === "arrow") {
            var a = Math.atan2(st.y2 - st.y1, st.x2 - st.x1), h = 12;
            var p1 = [st.x2 - h * Math.cos(a - 0.4), st.y2 - h * Math.sin(a - 0.4)];
            var p2 = [st.x2 - h * Math.cos(a + 0.4), st.y2 - h * Math.sin(a + 0.4)];
            parts.push('<polygon points="' + st.x2 + ',' + st.y2 + ' ' + p1[0] + ',' + p1[1] + ' ' +
              p2[0] + ',' + p2[1] + '" fill="' + c + '"/>');
          }
        } else if (st.tool === "rect") {
          parts.push('<rect x="' + Math.min(st.x1, st.x2) + '" y="' + Math.min(st.y1, st.y2) +
            '" width="' + Math.abs(st.x2 - st.x1) + '" height="' + Math.abs(st.y2 - st.y1) +
            '" fill="none" stroke="' + c + '" stroke-width="' + w + '"/>');
        } else if (st.tool === "text") {
          parts.push('<text x="' + st.x1 + '" y="' + st.y1 + '" fill="' + c +
            '" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">' +
            esc(st.text || "") + "</text>");
        }
      });
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + Math.round(r.width + pad * 2) +
        '" height="' + Math.round(r.height + pad * 2) + '" viewBox="0 0 ' + Math.round(r.width + pad * 2) +
        " " + Math.round(r.height + pad * 2) + '">' +
        '<rect width="100%" height="100%" fill="#141414"/>' + parts.join("") + "</svg>";
    }

    document.getElementById("svg").addEventListener("click", function () {
      if (!strokes.length) { setStatus("Nothing drawn yet."); return; }
      var blob = new Blob([svgText()], { type: "image/svg+xml" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sketch-" + Date.now() + ".svg";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      setStatus("SVG exported — " + strokes.length + " vector marks (images excluded).");
    });

    document.getElementById("shot").addEventListener("click", function () {
      flatten().then(function (url) {
        var a = document.createElement("a");
        a.href = url; a.download = "sketch-" + Date.now() + ".png"; a.click();
      });
    });

    document.getElementById("create").addEventListener("click", function () {
      var prompt = (promptEl.value || "").trim();
      if (!prompt) { setStatus("Describe what to create first."); promptEl.focus(); return; }
      var btn = document.getElementById("create");
      btn.disabled = true;
      var iterate = document.getElementById("iterate").checked && !!lastRenderUrl;
      setStatus(iterate ? "Creating — using the last render as the reference…" : "Creating — flattening the board…");
      (iterate ? toDataUrl(lastRenderUrl) : flatten()).then(function (composite) {
        setStatus("Creating — the model is working…");
        // Create is the other moment a board becomes a project: without an id the
        // render lands as an asset no job claims.
        return ensureJob().then(function (id) {
          var body = {
            action: "render",
            prompt: prompt + (iterate
              ? "\n\nThe attached image is the PREVIOUS render of this board. Change it as instructed and keep everything the instruction does not mention."
              : "\n\nThe attached image is the owner's board: placed images plus hand-drawn marks, arrows and notes showing what belongs where and how it moves. Honour the layout, the connections and the annotations."),
            refs: [composite],
            jobId: id,
          };
          return fetch("/api/buzzy/art", {
            method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
        });
      }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) {
          setStatus(res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "") : (res.d.error || "Could not create."));
          return;
        }
        var img = res.d.image;
        lastRenderUrl = img.url;
        setStatus("Done in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — added to the board and to the project.");
        var box = document.getElementById("result");
        box.style.display = "block";
        document.getElementById("resultImg").src = img.url;
        document.getElementById("resultLink").href = img.url;
        addImage(img.url, { x: 60 + images.length * 18, y: 60 + images.length * 18 });
      }).catch(function (e) {
        btn.disabled = false;
        setStatus("Failed: " + e.message);
      });
    });

    // ── region edit ───────────────────────────────────────────────────
    // A change to one part of a finished picture. The mask is a PNG at the picture's
    // natural size: black everywhere, white where the owner dragged. Sending the
    // picture + mask + instruction is what keeps the rest of the frame from being
    // re-rolled, which is the difference between an edit and a fresh guess.
    (function initRegionEdit() {
      var overlay = document.getElementById("regionOverlay");
      var rectEl = document.getElementById("regionRect");
      var img = document.getElementById("resultImg");
      var box = document.getElementById("result");
      var input = document.getElementById("regionPrompt");
      var btn = document.getElementById("regionApply");
      var note = document.getElementById("regionStatus");
      var dragStart = null;
      var picked = null;   // {x,y,w,h} in CSS pixels relative to the picture

      function syncOverlay() {
        if (!lastRenderUrl) { overlay.classList.remove("on"); return; }
        var r = img.getBoundingClientRect();
        var b = box.getBoundingClientRect();
        overlay.style.left = (r.left - b.left) + "px";
        overlay.style.top = (r.top - b.top) + "px";
        overlay.style.width = r.width + "px";
        overlay.style.height = r.height + "px";
        overlay.classList.add("on");
      }

      overlay.addEventListener("mousedown", function (e) {
        var r = overlay.getBoundingClientRect();
        dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
        rectEl.style.display = "block";
        rectEl.style.left = dragStart.x + "px";
        rectEl.style.top = dragStart.y + "px";
        rectEl.style.width = "0px";
        rectEl.style.height = "0px";
        e.preventDefault();
      });
      overlay.addEventListener("mousemove", function (e) {
        if (!dragStart) return;
        var r = overlay.getBoundingClientRect();
        var x = Math.max(0, Math.min(r.width, e.clientX - r.left));
        var y = Math.max(0, Math.min(r.height, e.clientY - r.top));
        var x0 = Math.min(x, dragStart.x), y0 = Math.min(y, dragStart.y);
        rectEl.style.left = x0 + "px"; rectEl.style.top = y0 + "px";
        rectEl.style.width = Math.abs(x - dragStart.x) + "px";
        rectEl.style.height = Math.abs(y - dragStart.y) + "px";
      });
      overlay.addEventListener("mouseup", function (e) {
        if (!dragStart) return;
        var r = overlay.getBoundingClientRect();
        var x = Math.max(0, Math.min(r.width, e.clientX - r.left));
        var y = Math.max(0, Math.min(r.height, e.clientY - r.top));
        picked = {
          x: Math.min(x, dragStart.x), y: Math.min(y, dragStart.y),
          w: Math.abs(x - dragStart.x), h: Math.abs(y - dragStart.y),
          scaleX: img.naturalWidth / r.width, scaleY: img.naturalHeight / r.height,
        };
        dragStart = null;
        if (picked.w < 8 || picked.h < 8) { picked = null; note.textContent = "That box is too small — drag a wider area."; return; }
        note.textContent = Math.round(picked.w) + "×" + Math.round(picked.h) + " selected. Describe the change.";
        input.focus();
      });

      window.addEventListener("resize", syncOverlay);
      img.addEventListener("load", syncOverlay);

      function maskDataUrl() {
        var w = img.naturalWidth, h = img.naturalHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#fff";
        g.fillRect(picked.x * picked.scaleX, picked.y * picked.scaleY, picked.w * picked.scaleX, picked.h * picked.scaleY);
        return c.toDataURL("image/png");
      }

      btn.addEventListener("click", function () {
        var instruction = (input.value || "").trim();
        if (!lastRenderUrl) { note.textContent = "Create a picture first, then change part of it."; return; }
        if (!picked) { note.textContent = "Drag a box on the picture first."; return; }
        if (!instruction) { input.focus(); note.textContent = "Say what should change inside the box."; return; }
        var imageId = Number(String(lastRenderUrl).split("/").pop());
        btn.disabled = true;
        note.textContent = "Changing that area…";
        fetch("/api/buzzy/art", {
          method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "edit", jobId: jobId || undefined, imageId: imageId, mask: maskDataUrl(), instruction: instruction }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.ok) {
              note.textContent = res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "")
                : "Could not change it: " + (res.d.error || "unknown");
              return;
            }
            lastRenderUrl = res.d.image.url;
            img.src = res.d.image.url;
            document.getElementById("resultLink").href = res.d.image.url;
            addImage(res.d.image.url, { x: 60 + images.length * 18, y: 60 + images.length * 18 });
            picked = null;
            rectEl.style.display = "none";
            note.textContent = "Changed in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — saved to this project.";
            flushSave();
          })
          .catch(function (e) { btn.disabled = false; note.textContent = "Failed: " + e.message; });
      });
    })();

    // ── load the saved board ──────────────────────────────────────────
    function load() {
      if (!jobId) { resize(); return; }
      // The board belongs to a project; show the project's name, not "New board".
      fetch("/api/buzzy/projects/" + encodeURIComponent(jobId), { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (p) {
          var t = p && p.project && p.project.title ? String(p.project.title) : "";
          if (t) {
            titleEl.textContent = t;
            document.title = t + " — BeeZilla Sketch";
          }
        })
        .catch(function () {});
      fetch("/api/buzzy/art?job=" + encodeURIComponent(jobId), { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.board) {
            strokes = d.board.strokes || [];
            images = d.board.images || [];
          }
          if (d && d.images && d.images.length) {
            var last = d.images[d.images.length - 1];
            lastRenderUrl = last.url;
            var box = document.getElementById("result");
            box.style.display = "block";
            document.getElementById("resultImg").src = last.url;
            document.getElementById("resultLink").href = last.url;
          }
          resize();
          renderImages();
        })
        .catch(function () { resize(); });
    }

    // A board with no project gets one when the owner first PUTS something on it —
    // never on page load. Opening Sketch used to POST a new job_art_… every time the
    // nav sent you here, so a lap of the site left a heap of empty "Sketch board"
    // projects (BZ-13, Nov 2026). One promise, so a burst of strokes still makes one.
    var jobPromise = null;
    function ensureJob() {
      if (jobId) return Promise.resolve(jobId);
      if (jobPromise) return jobPromise;
      var id = "job_art_" + Date.now().toString(36);
      // POST /api/buzzy/jobs is the upsert (a PUT to /jobs/<id> is a 404 — the
      // route does not exist, and a board with nowhere to land orphans its render).
      jobPromise = fetch("/api/buzzy/jobs", {
        method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: id, title: "Sketch board", status: "In progress", data: {} }),
      }).then(function (r) {
        if (!r.ok) throw new Error("could not open a board");
        jobId = id;
        history.replaceState({}, "", "/buzzy/sketch?job=" + encodeURIComponent(id));
        setStatus("New board ready. Drop images, draw, then Create.");
        return id;
      }).catch(function (e) {
        // One failed attempt must not become one POST per brush stroke: retry on a
        // later mark, not on every mark.
        setTimeout(function () { jobPromise = null; }, 5000);
        throw e;
      });
      return jobPromise;
    }
    if (!jobId) titleEl.textContent = "New board";
    window.addEventListener("resize", resize);
    // A stage that changes size without a window resize (nav rows wrapping, fonts
    // landing, #bzPage gaining its flex on a soft hop) must re-measure the backing
    // store, or the canvas keeps the size it guessed at parse time.
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
    load();
  })();
</script>
</body>
</html>
