<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeeZilla — Memory</title>
  <link rel="icon" type="image/png" href="/buzzy/brand/revision6_expressions_16-smiling.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel2: #1a1a1a;
      --line: #2a2a2a;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --yellow: #ffc107;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    header > .header-inner,
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header img { width: 48px; height: 48px; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header h1 span { color: var(--yellow); }
    /* The nav is chrome (nav.js + nav.css own it). This page used to carry bare
       `nav { margin-left: auto }` rules, which beat nothing in nav.css and pushed
       #bzNav to the right edge here while every other page centred it — the
       "Memory has a different header" report (BZ-15 follow-up, Nov 2026). A page
       styles its own content; the header belongs to the shell. */
    .brand-link { text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; }
    main { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
    /* The page itself is the brain explorer (brain.js + brain.css). */
    .empty { color: var(--muted); padding: 1rem 0; }
    .signout {
      text-align: center;
      padding: 3rem 0;
    }
    .signout a {
      color: var(--yellow);
      border: 1px solid var(--line);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
    }
  
    .account-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.4rem;
      background: var(--bz-panel, #141414);
      border: 1px solid #2A2A2A;
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      min-width: 200px;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .account-menu .am-name { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .account-menu .am-email { font-size: 0.75rem; color: #888; margin: 0.15rem 0 0.6rem; word-break: break-all; }
    .account-menu .am-signout {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
    }
    .header-inner, header { position: relative; }
</style>
<link rel="stylesheet" href="/buzzy/nav.css" />
<link rel="stylesheet" href="/buzzy/brain.css" />
</head>
<body>
  <header>
      <div class="header-inner">
  <a href="/buzzy/talk" class="brand-link">
        <div class="brand">
          <img class="mascot-mark" src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="BeeZilla" />
          <strong>BeeZilla</strong>
        </div>
      </a>
      <nav id="bzNav">
      <a href="/buzzy/talk" data-nav="talk">Talk</a>
      <a href="/buzzy/library" data-nav="library">Library</a>
      <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
      <a href="/buzzy/memory" data-nav="memory">Memory</a>
      <a href="/buzzy/experts" data-nav="experts">Experts</a>
      <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
      <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
      <a href="/buzzy/upload" data-nav="publish">Publish</a>
      <a href="/buzzy/landing" class="account-link" id="accountLink">Sign in</a>
    </nav>
    <script>
    /* ONE navigation, defined once. Every page used to hand-write its own nav
       and they drifted: "Talk" pointed at /buzzy/ (the Jobs/Library page), so the
       chat was unreachable from the nav — that is why you could not get back to
       TALK. Active state is computed here from the path, not hard-coded per page. */
    (function () {
      var path = location.pathname.replace(/\.html$/, "").replace(/\/+$/, "");
      // index.html serves ONLY /buzzy/library; every other /buzzy route
      // redirects to the chat, so bare /buzzy counts as Talk here.
      var section = "library";
      if (/^\/buzzy(\/talk)?$/.test(path)) section = "talk";
      else if (/^\/buzzy\/library$/.test(path)) section = "library";
      else if (/^\/buzzy\/(memory|remember)$/.test(path)) section = "memory";
      else if (/^\/buzzy\/experts$/.test(path)) section = "experts";
      else if (/^\/buzzy\/recipes$/.test(path)) section = "recipes";
      else if (/^\/buzzy\/wallet$/.test(path)) section = "wallet";
      else if (/^\/buzzy\/upload$/.test(path)) section = "publish";
      // These screens are not in the nav, so nothing lights up — claiming
      // "Library" was active on the business profile was simply wrong.
      else if (/^\/buzzy\/(profile|landing)?$/.test(path)) section = "";
      var links = document.querySelectorAll("#bzNav a[data-nav]");
      for (var i = 0; i < links.length; i++) {
        var on = links[i].getAttribute("data-nav") === section;
        links[i].classList.toggle("active", on);
        if (on) links[i].setAttribute("aria-current", "page");
        else links[i].removeAttribute("aria-current");
      }
      // Account identity is the page's own job (each page has its own session
      // code). The nav only guarantees the links and their order.
    })();
    </script>
  </div>
  </header>
  <main>
    <!-- The brain (brain.js, owner 2026-11-23): the whole tree from brain at the core down, A to
         Z, the same explorer as Talk's Memory tab, on a page of its own. The address keeps the
         folder you are in (#brain/knowledge/programming), so it can be bookmarked or shared. -->
    <div id="content"><p class="empty">Loading your brain…</p></div>
  </main>
  <script src="/buzzy/companies.js"></script>
  <script>
    // ── Account gate. The chrome (nav.js) owns the identity chip and its menu;
    // this page only refuses a signed-out visitor. A second menu here raced the
    // chrome's and made the name disappear on some loads. ─────────────────────
    (function accountGate() {
      fetch("/api/auth/get-session", { credentials: "same-origin" })
        // A non-2xx is an outage, not a logout. The chrome already refuses to
        // erase a real identity on a 500 (fee2c5f); this page gate used to take
        // the same answer as "signed out" and eject a signed-in reader to
        // /buzzy/landing. Only a 200 with no user may refuse.
        .then(function (r) {
          if (!r.ok) throw new Error("get-session " + r.status);
          return r.json();
        })
        .then(function (session) {
          if (!(session && session.user)) window.location.replace("/buzzy/landing");
        })
        .catch(function () {});
    })();
    // ── The brain, full page ───────────────────────────────────────────────
    // brain.js is loaded for the whole document by agents.js (and by the tag below when this
    // page is opened on its own); it says "bz:brain-ready" when it is in.
    (function brainPage() {
      var host = document.getElementById("content");
      var handle = null;
      function fromHash() {
        var h = "";
        try { h = decodeURIComponent(location.hash.replace(/^#/, "")); } catch (e) { h = ""; }
        return h.replace(/^\/?brain\/?/, "");
      }
      function keep(p) {
        try { history.replaceState(history.state, "", location.pathname + location.search + "#brain" + (p ? "/" + p : "")); } catch (e) { /* best effort */ }
      }
      function mountIt() {
        if (handle || !window.BeeZillaBrain || !host || !host.isConnected) return;
        var wanted = window.BeeZillaBrain.wanted && window.BeeZillaBrain.wanted();
        handle = window.BeeZillaBrain.mount(host, { path: wanted || fromHash(), onPath: keep });
      }
      if (window.BeeZillaBrain) mountIt();
      else window.addEventListener("bz:brain-ready", mountIt);
      window.addEventListener("hashchange", function () { if (handle && host.isConnected) handle.open(fromHash()); });
    })();
  </script>
  <script src="/buzzy/brain.js"></script>
  <!-- BZ-15 residual: common.js was the SECOND gate on this page (the accountGate IIFE
       above is the first, and it refuses only on a 200 with no user). common.js's
       __bzHeader() ran gateSignedOut(), whose resolveSession() answers a non-2xx with
       null — so one 500 from /api/auth/get-session ejected a signed-in reader to
       /buzzy/landing in under 100ms. The chrome (nav.js) owns the header, the account
       chip and the active nav link, so this page needs no part of it. Do not re-add:
       a page-level session read must never be able to log somebody out. -->
</body>
</html>
