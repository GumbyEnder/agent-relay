<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐴 BeeZilla — Memory</title>
  <link rel="icon" type="image/png" href="/buzzy/brand/revision6_expressions_16-smiling.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel2: #1a1a1a;
      --line: #2a2a2a;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --yellow: #ffc107;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    header > .header-inner,
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header img { width: 48px; height: 48px; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header h1 span { color: var(--yellow); }
    nav {
      display: flex;
      gap: 1rem;
      margin-left: auto;
      font-size: 0.92rem;
    }
    nav a { color: var(--muted); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: 6px; }
    nav a.active { color: var(--yellow); background: var(--panel2); }
    .brand-link { text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; }
    nav a:hover { color: var(--text); }
    nav .account-link { color: var(--yellow); border: 1px solid var(--line); }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    /* Memory redesign: digest card + per-job drill-down */
    .mem-digest {
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0;
    }
    .mem-digest h2 { margin: 0 0 0.4rem; color: var(--yellow); font-size: 1rem; }
    .mem-digest p { margin: 0; color: var(--text); font-size: 0.92rem; line-height: 1.5; }
    .mem-job {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .mem-job-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: none;
      border: none;
      color: var(--text);
      font: inherit;
      text-align: left;
      padding: 0.7rem 0.9rem;
      cursor: pointer;
    }
    .mem-job-head:hover { background: rgba(255,193,7,0.05); }
    .mem-job-head .mj-title { font-weight: 600; color: #fff; min-width: 90px; }
    .mem-job-head .mj-digest {
      flex: 1;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mem-job-head .mj-count {
      background: rgba(255,193,7,0.12);
      color: var(--yellow);
      border-radius: 10px;
      font-size: 0.72rem;
      padding: 0.1rem 0.55rem;
      font-weight: 600;
    }
    .mem-job-detail { padding: 0.4rem 0.9rem 0.8rem; border-top: 1px solid var(--line); }
    .mem-conv { margin-top: 1.5rem; }
    .mem-conv summary {
      cursor: pointer;
      color: var(--yellow);
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.6rem;
    }
    .muted { color: var(--muted); }
    .mem-status {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      min-width: 140px;
    }
    .stat b { font-size: 1.5rem; display: block; color: var(--yellow); }
    .stat span { font-size: 0.8rem; color: var(--muted); }
    section h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.4rem;
    }
    .fact {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--yellow);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
    }
    .fact .v { font-weight: 600; }
    .fact .k { color: var(--muted); font-size: 0.85rem; }
    .fact .j { color: var(--muted); font-size: 0.75rem; }
    .msg {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .msg.assistant { border-left: 3px solid #6c7bd9; }
    .msg.user { border-left: 3px solid var(--yellow); }
    .msg .who { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.2rem; }
    .empty { color: var(--muted); padding: 1rem 0; }
    .signout {
      text-align: center;
      padding: 3rem 0;
    }
    .signout a {
      color: var(--yellow);
      border: 1px solid var(--line);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
    }
  
    .account-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.4rem;
      background: var(--bz-panel, #141414);
      border: 1px solid #2A2A2A;
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      min-width: 200px;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .account-menu .am-name { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .account-menu .am-email { font-size: 0.75rem; color: #888; margin: 0.15rem 0 0.6rem; word-break: break-all; }
    .account-menu .am-signout {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
    }
    .header-inner, header { position: relative; }
</style>
</head>
<body>
  <header>
      <div class="header-inner">
  <a href="/buzzy/" class="brand-link">
        <img src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="BeeZilla" />
        <h1>Bee<span>Zilla</span> — Memory</h1>
      </a>
      <nav>
        <a href="/buzzy/" id="jobsLink">Jobs</a>
        <a href="/buzzy/talk" id="talkLink">Chat</a>
        <a href="/buzzy/memory" id="memLink" class="active">Memory</a>
        <a href="/buzzy/experts">Experts</a>
        <a href="/buzzy/library" id="libLink">Library</a>
        <a href="/login" class="account-link">Sign in</a>
      </nav>
  </div>
  </header>
  <main>
    <div id="content"><p class="empty">Loading memory…</p></div>
  </main>
  <script>
    // Session-aware account link (same as talk.html) — memory.html previously
    // had no account code, so signed-in users always saw "Sign in" (dogfood 10003).
    (function account() {
      var link = document.querySelector(".account-link");
      if (!link) return;
      fetch("/api/auth/get-session", { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (session) {
          var user = session && session.user;
          if (!user || !user.name) return;
          link.textContent = user.name;
          link.href = "#";
          link.style.cursor = "pointer";
          // Profile menu: clicking the name opens a small account panel
          var menu = document.createElement("div");
          menu.className = "account-menu";
          menu.style.display = "none";
          menu.innerHTML =
            '<div class="am-name">' + user.name + "</div>" +
            '<div class="am-email">' + (user.email || "") + "</div>" +
            '<button type="button" class="am-signout">Log out</button>';
          var out = menu.querySelector(".am-signout");
          out.addEventListener("click", function (e) {
            e.preventDefault();
            fetch("/api/auth/sign-out", {
              method: "POST",
              credentials: "same-origin",
              headers: { "content-type": "application/json" },
              body: "{}",
            }).then(function () { window.location.href = "/buzzy/"; });
          });
          link.parentNode.insertBefore(menu, link.nextSibling);
          link.addEventListener("click", function (e) {
            e.preventDefault();
            menu.style.display = menu.style.display === "none" ? "block" : "none";
          });
          document.addEventListener("click", function (e) {
            if (!menu.contains(e.target) && e.target !== link) menu.style.display = "none";
          });
        })
        .catch(function () {});
    })();
    // esc is hoisted via function declaration, but keep it above the IIFE for
    // safety — the memory render previously could throw mid-template and leave
    // "Loading memory…" stuck (dogfood 10016).
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = String(s ?? "");
      return d.innerHTML;
    }
    (async () => {
      try {
      const res = await fetch("/api/buzzy/memory", { credentials: "same-origin" });
      const root = document.getElementById("content");
      if (res.status === 401) {
        root.innerHTML =
          '<div class="signout"><p class="muted">Memory is tied to your account.</p><a href="/login">Sign in</a></div>';
        return;
      }
      if (!res.ok) {
        root.innerHTML = '<p class="empty">Couldn\u2019t load memory right now. Try refreshing.</p>';
        return;
      }
      const data = await res.json();
      const facts = data.facts || [];
      const messages = data.messages || [];
      const honcho = data.honchoAvailable;
      const jobLabel = (id) => (id ? id.slice(0, 8) : "General");

      // ── Memory redesign: summary first, drill-down on demand ──────────
      // Group facts by job, show a plain-language summary line per job plus
      // a one-line "what we know" digest; details hidden behind toggles.
      const jobsMap = {};
      facts.forEach((f) => {
        const k = f.jobId || "general";
        (jobsMap[k] = jobsMap[k] || []).push(f);
      });

      const digest = facts.length
        ? facts.slice(0, 5).map((f) => esc(f.value)).join(" · ")
        : "Nothing yet — chat with BeeZilla and what it learns will appear here.";

      const stats = `
        <div class="mem-status">
          <div class="stat"><b>${facts.length}</b><span>things known</span></div>
          <div class="stat"><b>${Object.keys(jobsMap).length}</b><span>jobs touched</span></div>
          <div class="stat"><b>${honcho ? "on" : "off"}</b><span>long-term memory</span></div>
        </div>`;

      const summaryCard = `
        <div class="mem-digest">
          <h2>At a glance</h2>
          <p>${digest}</p>
        </div>`;

      const jobsHtml = Object.keys(jobsMap).length
        ? Object.entries(jobsMap).map(([jobId, fs]) => {
            const label = jobLabel(jobId);
            const digestLine = fs.map((f) => esc(f.value)).join(" · ");
            const detailRows = fs
              .map((f) => `<div class="fact"><span class="k">${esc(f.key)}</span><span class="v">${esc(f.value)}</span></div>`)
              .join("");
            return `<div class="mem-job">
              <button type="button" class="mem-job-head" data-job="${esc(jobId)}">
                <span class="mj-title">${esc(label)}</span>
                <span class="mj-digest">${digestLine}</span>
                <span class="mj-count">${fs.length}</span>
              </button>
              <div class="mem-job-detail" style="display:none">${detailRows}</div>
            </div>`;
          }).join("")
        : '<p class="empty">No decisions captured yet. Talk to BeeZilla and locked-in decisions will appear here.</p>';

      const msgsHtml = messages.length
        ? messages.slice(0, 20)
            .map(
              (m) =>
                `<div class="msg ${esc(m.role)}"><div class="who">${m.role === "assistant" ? "BeeZilla" : "You"} · ${jobLabel(m.jobId)}</div>${esc(m.content)}</div>`,
            )
            .join("")
        : '<p class="empty">No conversations yet.</p>';

      root.innerHTML =
        stats +
        summaryCard +
        '<section><h2>By job</h2>' + jobsHtml + '</section>' +
        '<details class="mem-conv"><summary>Recent conversations</summary>' + msgsHtml + '</details>';

      // Wire drill-down toggles
      root.querySelectorAll(".mem-job-head").forEach((btn) => {
        btn.addEventListener("click", () => {
          const d = btn.parentElement.querySelector(".mem-job-detail");
          const open = d.style.display !== "none";
          d.style.display = open ? "none" : "block";
          btn.classList.toggle("open", !open);
        });
      });
      } catch (err) {
        const root = document.getElementById("content");
        if (root) root.innerHTML = '<p class="empty">Couldn\u2019t load memory right now. Try refreshing.</p>';
      }
    })();
  </script>
</body>
</html>
