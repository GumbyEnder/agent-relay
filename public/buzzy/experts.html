<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeeZilla — Experts</title>
  <style>
    :root {
      --bz-black: #0A0A0A;
      --bz-panel: #141414;
      --bz-col: #1A1A1A;
      --bz-yellow: #FFC107;
      --bz-yellow-dim: #B8860B;
      --bz-silver: #C9CDD2;
      --bz-charcoal: #111111;
      --bz-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--bz-font);
      color: #E8E8E8;
      background: var(--bz-black);
      margin: 0;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid #222;
      background: var(--bz-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header > .header-inner,
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header .brand strong {
      letter-spacing: .06em;
      font-size: 1.15rem;
      color: var(--bz-yellow);
      text-transform: uppercase;
      font-weight: 800;
    }
    header .brand .mascot-mark {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    header nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    header nav a {
      color: #999;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    header nav a:hover { color: var(--bz-yellow); }
    header nav a.active { color: var(--bz-yellow); font-weight: 600; }
    header .brand-link { text-decoration: none; cursor: pointer; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
      color: #fff;
      font-weight: 700;
    }
    .muted { color: #777; font-size: 0.82rem; }
    .experts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 1100px) { .experts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .experts-grid { grid-template-columns: 1fr; } }
    .expert-card {
      background: var(--bz-panel);
      border: 1px solid #2A2A2A;
      border-top: 3px solid var(--bz-yellow);
      border-radius: 6px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 170px;
    }
    .expert-card h2 {
      font-size: 1.05rem;
      margin: 0;
      color: var(--bz-yellow);
      font-weight: 700;
    }
    .expert-card p {
      margin: 0;
      color: #C8C8C8;
      font-size: 0.88rem;
    }
    .expert-card button {
      align-self: flex-start;
      margin-top: 0.3rem;
    }
    button {
      font: inherit;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--bz-yellow);
      background: var(--bz-yellow);
      color: var(--bz-black);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 4px;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--bz-yellow-dim); border-color: var(--bz-yellow-dim); }
    button:active { transform: scale(0.98); }
  
    .account-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.4rem;
      background: var(--bz-panel, #141414);
      border: 1px solid #2A2A2A;
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      min-width: 200px;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .account-menu .am-name { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .account-menu .am-email { font-size: 0.75rem; color: #888; margin: 0.15rem 0 0.6rem; word-break: break-all; }
    .account-menu .am-signout {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
    }
    .header-inner, header { position: relative; }
</style>
<link rel="stylesheet" href="/buzzy/nav.css" />
</head>
<body>
  <header>
      <div class="header-inner">
  <a href="/buzzy/talk" class="brand-link">
        <div class="brand">
          <img class="mascot-mark" src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="BeeZilla" />
          <strong>BeeZilla</strong>
        </div>
      </a>
      <nav id="bzNav">
      <a href="/buzzy/talk" data-nav="talk">Talk</a>
      <a href="/buzzy/library" data-nav="library">Library</a>
      <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
      <a href="/buzzy/memory" data-nav="memory">Memory</a>
      <a href="/buzzy/experts" data-nav="experts">Experts</a>
      <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
      <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
      <a href="/buzzy/upload" data-nav="publish">Publish</a>
      <a href="/buzzy/landing" class="account-link" id="accountLink">Sign in</a>
    </nav>
    <script src="/buzzy/experts-data.js"></script>
  <script>
    /* ONE navigation, defined once. Every page used to hand-write its own nav
       and they drifted: "Talk" pointed at /buzzy/ (the Jobs/Library page), so the
       chat was unreachable from the nav — that is why you could not get back to
       TALK. Active state is computed here from the path, not hard-coded per page. */
    (function () {
      var path = location.pathname.replace(/\.html$/, "").replace(/\/+$/, "");
      // index.html serves ONLY /buzzy/library; every other /buzzy route
      // redirects to the chat, so bare /buzzy counts as Talk here.
      var section = "library";
      if (/^\/buzzy(\/talk)?$/.test(path)) section = "talk";
      else if (/^\/buzzy\/library$/.test(path)) section = "library";
      else if (/^\/buzzy\/(memory|remember)$/.test(path)) section = "memory";
      else if (/^\/buzzy\/experts$/.test(path)) section = "experts";
      else if (/^\/buzzy\/recipes$/.test(path)) section = "recipes";
      else if (/^\/buzzy\/wallet$/.test(path)) section = "wallet";
      else if (/^\/buzzy\/upload$/.test(path)) section = "publish";
      // These screens are not in the nav, so nothing lights up — claiming
      // "Library" was active on the business profile was simply wrong.
      else if (/^\/buzzy\/(profile|landing)?$/.test(path)) section = "";
      var links = document.querySelectorAll("#bzNav a[data-nav]");
      for (var i = 0; i < links.length; i++) {
        var on = links[i].getAttribute("data-nav") === section;
        links[i].classList.toggle("active", on);
        if (on) links[i].setAttribute("aria-current", "page");
        else links[i].removeAttribute("aria-current");
      }
      // Account identity is the page's own job (each page has its own session
      // code). The nav only guarantees the links and their order.
    })();
    </script>
  </div>
  </header>
  <script>
    // ── Account gate. The chrome (nav.js) owns the identity chip and its menu;
    // this page only refuses a signed-out visitor. A second menu here raced the
    // chrome's and made the name disappear on some loads. ─────────────────────
    (function accountGate() {
      fetch("/api/auth/get-session", { credentials: "same-origin" })
        // A non-2xx is an outage, not a logout. The chrome already refuses to
        // erase a real identity on a 500 (fee2c5f); this page gate used to take
        // the same answer as "signed out" and eject a signed-in reader to
        // /buzzy/landing. Only a 200 with no user may refuse.
        .then(function (r) {
          if (!r.ok) throw new Error("get-session " + r.status);
          return r.json();
        })
        .then(function (session) {
          if (!(session && session.user)) window.location.replace("/buzzy/landing");
        })
        .catch(function () {});
    })();
  </script>
  <style>
    .expert-card { cursor: pointer; transition: border-color 0.12s, transform 0.12s; }
    .expert-card:hover, .expert-card:focus-visible { border-color: var(--bz-yellow); transform: translateY(-1px); outline: none; }
    .expert-icon { font-size: 1.15rem; margin-right: 0.15rem; vertical-align: -0.05em; }
    .view-hint { color: var(--bz-yellow); font-size: 0.78rem; font-weight: 600; margin-top: auto; }
    .back-link { background: none; border: none; color: var(--bz-yellow); cursor: pointer; font-size: 0.9rem; font-weight: 600; padding: 0; margin: 0 0 1rem; }
    .back-link:hover { text-decoration: underline; }
    .expert-detail { background: var(--bz-panel); border: 1px solid #2A2A2A; border-top: 3px solid var(--bz-yellow); border-radius: 6px; padding: 1.75rem; max-width: 720px; }
    .expert-detail h1 { margin: 0 0 0.25rem; font-size: 1.5rem; color: var(--bz-yellow); }
    .expert-detail .detail-blurb { color: #C8C8C8; margin: 0 0 1.5rem; max-width: 60ch; }
    .expert-detail h2 { font-size: 1rem; margin: 0 0 0.75rem; color: #E8E8E8; }
    .skill-library { margin: 0 0 1.5rem; padding-left: 1.2rem; color: #D8D8D8; }
    .skill-library li { margin: 0.45rem 0; font-size: 0.95rem; }
    .disclaimer { font-size: 0.82rem; color: #777; border-top: 1px solid #222; padding-top: 1rem; margin: 0; }
  </style>
  <main>
    <div id="expertsRoot"></div>
  </main>
  <script>
    (function () {
      var EXPERTS = window.BZ_EXPERTS || [];
      var root = document.getElementById("expertsRoot");
      var ICONS = window.BZ_EXPERT_ICONS || {};
      function esc(s) { return String(s).replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function renderList() {
        var cards = EXPERTS.map(function (e) {
          return '<div class="expert-card" data-expert="' + e.id + '" role="button" tabindex="0">' +
            '<h2><span class="expert-icon">' + (ICONS[e.id] || "✦") + '</span> ' + esc(e.name) + '</h2>' +
            '<p>' + esc(e.blurb) + '</p>' +
            '<span class="view-hint">View skills &rarr;</span>' +
            '</div>';
        }).join("");
        root.innerHTML =
          '<h1>Experts</h1>' +
          '<p class="muted">Pick an area to see what BeeZilla excels at there.</p>' +
          '<div class="experts-grid">' + cards + '</div>';
        root.querySelectorAll(".expert-card").forEach(function (c) {
          function open() { renderDetail(c.getAttribute("data-expert")); }
          c.addEventListener("click", open);
          c.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } });
        });
      }
      function renderDetail(id) {
        var e = EXPERTS.find(function (x) { return x.id === id; });
        if (!e) return;
        var skills = e.skills.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
        root.innerHTML =
          '<button type="button" class="back-link" id="backExperts">&larr; All experts</button>' +
          '<div class="expert-detail">' +
            '<h1><span class="expert-icon">' + (ICONS[e.id] || "✦") + '</span> ' + esc(e.name) + '</h1>' +
            '<p class="detail-blurb">' + esc(e.blurb) + '</p>' +
            '<h2>What BeeZilla excels at here</h2>' +
            '<ul class="skill-library">' + skills + '</ul>' +
            '<p class="disclaimer">AI assistant with curated domain knowledge &mdash; not a licensed professional.</p>' +
          '</div>';
        document.getElementById("backExperts").addEventListener("click", renderList);
      }
      renderList();
    })();
  </script>
</body>
</html>
