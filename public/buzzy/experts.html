<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐴 BeeZilla — Experts</title>
  <style>
    :root {
      --bz-black: #0A0A0A;
      --bz-panel: #141414;
      --bz-col: #1A1A1A;
      --bz-yellow: #FFC107;
      --bz-yellow-dim: #B8860B;
      --bz-silver: #C9CDD2;
      --bz-charcoal: #111111;
      --bz-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--bz-font);
      color: #E8E8E8;
      background: var(--bz-black);
      margin: 0;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid #222;
      background: var(--bz-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header > .header-inner,
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header .brand strong {
      letter-spacing: .06em;
      font-size: 1.15rem;
      color: var(--bz-yellow);
      text-transform: uppercase;
      font-weight: 800;
    }
    header .brand .mascot-mark {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    header nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    header nav a {
      color: #999;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    header nav a:hover { color: var(--bz-yellow); }
    header nav a.active { color: var(--bz-yellow); font-weight: 600; }
    header .brand-link { text-decoration: none; cursor: pointer; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
      color: #fff;
      font-weight: 700;
    }
    .muted { color: #777; font-size: 0.82rem; }
    .experts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 1100px) { .experts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .experts-grid { grid-template-columns: 1fr; } }
    .expert-card {
      background: var(--bz-panel);
      border: 1px solid #2A2A2A;
      border-top: 3px solid var(--bz-yellow);
      border-radius: 6px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 170px;
    }
    .expert-card h2 {
      font-size: 1.05rem;
      margin: 0;
      color: var(--bz-yellow);
      font-weight: 700;
    }
    .expert-card p {
      margin: 0;
      color: #C8C8C8;
      font-size: 0.88rem;
    }
    .expert-card button {
      align-self: flex-start;
      margin-top: 0.3rem;
    }
    button {
      font: inherit;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--bz-yellow);
      background: var(--bz-yellow);
      color: var(--bz-black);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 4px;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--bz-yellow-dim); border-color: var(--bz-yellow-dim); }
    button:active { transform: scale(0.98); }
  
    .account-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.4rem;
      background: var(--bz-panel, #141414);
      border: 1px solid #2A2A2A;
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      min-width: 200px;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .account-menu .am-name { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .account-menu .am-email { font-size: 0.75rem; color: #888; margin: 0.15rem 0 0.6rem; word-break: break-all; }
    .account-menu .am-signout {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
    }
    .header-inner, header { position: relative; }
</style>
<link rel="stylesheet" href="/buzzy/nav.css" />
</head>
<body>
  <header>
      <div class="header-inner">
  <a href="/buzzy/" class="brand-link">
        <div class="brand">
          <img class="mascot-mark" src="brand/revision6_expressions_16-smiling.png" alt="BeeZilla" />
          <strong>BeeZilla</strong>
        </div>
      </a>
      <nav>
        <a href="/buzzy/">Work</a>
        <a href="/buzzy/memory">Memory</a>
        <a href="/buzzy/experts" class="active">Experts</a>
        <a href="/buzzy/library" id="libLink">Library</a>
        <a href="/buzzy/landing" class="account-link">Sign in</a>
      </nav>
  </div>
  </header>
  <script>
    // Session-aware account link (same as talk.html) — experts.html previously
    // had no account code, so signed-in users always saw "Sign in" (dogfood 10003).
    (function account() {
      var link = document.querySelector(".account-link");
      if (!link) return;
      fetch("/api/auth/get-session", { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (session) {
          var user = session && session.user;
          if (!user) { window.location.replace("/buzzy/landing"); return; }
          var bzDisplayName = user.name || user.email || "Account";
          link.textContent = bzDisplayName;
          link.href = "#";
          link.style.cursor = "pointer";
          // Profile menu: clicking the name opens a small account panel
          var menu = document.createElement("div");
          menu.className = "account-menu";
          menu.style.display = "none";
          menu.innerHTML =
            '<div class="am-name">' + bzDisplayName + "</div>" +
            '<div class="am-email">' + (user.email || "") + "</div>" +
            '<button type="button" class="am-signout">Log out</button>';
          var out = menu.querySelector(".am-signout");
          out.addEventListener("click", function (e) {
            e.preventDefault();
            fetch("/api/auth/sign-out", {
              method: "POST",
              credentials: "same-origin",
              headers: { "content-type": "application/json" },
              body: "{}",
            }).then(function () { window.location.href = "/buzzy/"; });
          });
          link.parentNode.insertBefore(menu, link.nextSibling);
          link.addEventListener("click", function (e) {
            e.preventDefault();
            menu.style.display = menu.style.display === "none" ? "block" : "none";
          });
          document.addEventListener("click", function (e) {
            if (!menu.contains(e.target) && e.target !== link) menu.style.display = "none";
          });
        })
        .catch(function () {});
    })();
  </script>
  <style>
    .expert-card { cursor: pointer; transition: border-color 0.12s, transform 0.12s; }
    .expert-card:hover, .expert-card:focus-visible { border-color: var(--bz-yellow); transform: translateY(-1px); outline: none; }
    .expert-icon { font-size: 1.15rem; margin-right: 0.15rem; vertical-align: -0.05em; }
    .view-hint { color: var(--bz-yellow); font-size: 0.78rem; font-weight: 600; margin-top: auto; }
    .back-link { background: none; border: none; color: var(--bz-yellow); cursor: pointer; font-size: 0.9rem; font-weight: 600; padding: 0; margin: 0 0 1rem; }
    .back-link:hover { text-decoration: underline; }
    .expert-detail { background: var(--bz-panel); border: 1px solid #2A2A2A; border-top: 3px solid var(--bz-yellow); border-radius: 6px; padding: 1.75rem; max-width: 720px; }
    .expert-detail h1 { margin: 0 0 0.25rem; font-size: 1.5rem; color: var(--bz-yellow); }
    .expert-detail .detail-blurb { color: #C8C8C8; margin: 0 0 1.5rem; max-width: 60ch; }
    .expert-detail h2 { font-size: 1rem; margin: 0 0 0.75rem; color: #E8E8E8; }
    .skill-library { margin: 0 0 1.5rem; padding-left: 1.2rem; color: #D8D8D8; }
    .skill-library li { margin: 0.45rem 0; font-size: 0.95rem; }
    .disclaimer { font-size: 0.82rem; color: #777; border-top: 1px solid #222; padding-top: 1rem; margin: 0; }
  </style>
  <main>
    <div id="expertsRoot"></div>
  </main>
  <script>
    (function () {
      var EXPERTS = [
        { id: "legal", name: "Legal", blurb: "Letters, agreements, notices — not legal advice.", skills: ["Demand letters and payment reminders", "Simple contracts and contractor agreements", "Landlord notices and roommate agreements", "NDAs and release forms", "Dispute and appeal letters", "Plain-English summaries of legal documents"] },
        { id: "medical", name: "Medical", blurb: "Insurance questions, billing disputes, patient rights.", skills: ["Insurance denial and appeal letters", "Explanation-of-benefits walkthroughs", "Medical bill review and negotiation scripts", "Records request letters", "Patient-rights explainers", "Understanding your coverage"] },
        { id: "software", name: "Software", blurb: "Debugging, architecture, code reviews, best practices.", skills: ["Debugging and root-cause writeups", "Architecture and design reviews", "Code review checklists", "Refactoring plans", "Best-practice and security guidance", "Readable technical docs"] },
        { id: "technology", name: "Technology", blurb: "Hardware, infrastructure, deployment, ops.", skills: ["Infrastructure and hosting explainers", "Deployment runbooks", "Vendor and tool selection", "Migration plans", "Ops and maintenance checklists", "Plain-language tech specs for non-experts"] },
        { id: "accounting", name: "Accounting", blurb: "Budgets, invoices, tax questions, financial planning.", skills: ["Invoice and late-fee policy templates", "Monthly budget and cash-flow forecasts", "Rate cards and pricing guidance", "Aging-report and collection templates", "Tax-season prep checklists", "Financial planning explainers"] },
        { id: "home", name: "Home & Contractors", blurb: "Repairs, renovations, hiring help, comparing quotes, permits.", skills: ["Scope-of-work documents for quotes", "Quote comparison sheets", "Contractor vetting checklists", "Permit and licensing guidance", "Renovation planning", "Hiring and handover documents"] },
        { id: "career", name: "Career & Work", blurb: "Resumes, cover letters, job disputes, workplace communication.", skills: ["Resumes and cover letters", "Negotiation and counter-offer scripts", "Workplace dispute letters", "Performance-review preparation", "Job-search plans", "Professional email templates"] },
        { id: "insurance", name: "Insurance", blurb: "Claims, denials, appeal letters, understanding your coverage.", skills: ["Claim and denial appeal letters", "Policy explainers", "Coverage comparison", "Damage documentation checklists", "Escalation letters", "Understanding what you're covered for"] },
        { id: "government", name: "Government & Forms", blurb: "DMV, benefits, permits, citizenship paperwork, complaints.", skills: ["Form-completion walkthroughs", "Permit and license guidance", "Benefits application help", "Complaint letters", "Citizenship and immigration paperwork explainers", "Deadline and doc checklists"] },
        { id: "education", name: "Education", blurb: "School disputes, IEP/504 plans, applications, financial aid.", skills: ["IEP and 504 request letters", "School dispute correspondence", "Application and essay guidance", "Financial-aid explainers", "Advocacy talking points", "Meeting-preparation checklists"] },
        { id: "landlord", name: "Landlord & Tenant", blurb: "Leases, deposits, repairs, eviction questions, notices.", skills: ["Lease and room-rental agreements", "Security-deposit returns and letters", "Repair request notices", "Eviction and notice guidance", "Move-in/move-out checklists", "Tenant rights explainers"] },
        { id: "travel", name: "Travel", blurb: "Refunds, cancellations, disputes with airlines and hotels.", skills: ["Refund and cancellation requests", "Airline and hotel dispute letters", "Chargeback documentation", "Itinerary-change planning", "Rights explainers for travelers", "Escalation templates"] }
      ];
      var root = document.getElementById("expertsRoot");
      var ICONS = {
        legal: "⚖️", medical: "🩺", software: "💻", technology: "🖥️",
        accounting: "📊", home: "🏠", career: "💼", insurance: "🛡️",
        government: "📋", education: "🎓", landlord: "🏘️", travel: "✈️"
      };
      function esc(s) { return String(s).replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function renderList() {
        var cards = EXPERTS.map(function (e) {
          return '<div class="expert-card" data-expert="' + e.id + '" role="button" tabindex="0">' +
            '<h2><span class="expert-icon">' + (ICONS[e.id] || "✦") + '</span> ' + esc(e.name) + '</h2>' +
            '<p>' + esc(e.blurb) + '</p>' +
            '<span class="view-hint">View skills &rarr;</span>' +
            '</div>';
        }).join("");
        root.innerHTML =
          '<h1>Experts</h1>' +
          '<p class="muted">Pick an area to see what BeeZilla excels at there.</p>' +
          '<div class="experts-grid">' + cards + '</div>';
        root.querySelectorAll(".expert-card").forEach(function (c) {
          function open() { renderDetail(c.getAttribute("data-expert")); }
          c.addEventListener("click", open);
          c.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } });
        });
      }
      function renderDetail(id) {
        var e = EXPERTS.find(function (x) { return x.id === id; });
        if (!e) return;
        var skills = e.skills.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
        root.innerHTML =
          '<button type="button" class="back-link" id="backExperts">&larr; All experts</button>' +
          '<div class="expert-detail">' +
            '<h1><span class="expert-icon">' + (ICONS[e.id] || "✦") + '</span> ' + esc(e.name) + '</h1>' +
            '<p class="detail-blurb">' + esc(e.blurb) + '</p>' +
            '<h2>What BeeZilla excels at here</h2>' +
            '<ul class="skill-library">' + skills + '</ul>' +
            '<p class="disclaimer">AI assistant with curated domain knowledge &mdash; not a licensed professional.</p>' +
          '</div>';
        document.getElementById("backExperts").addEventListener("click", renderList);
      }
      renderList();
    })();
  </script>
</body>
</html>
