<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeeZilla — What BeeZilla remembers</title>
  <style>
    :root {
      --bz-black: #0A0A0A;
      --bz-panel: #141414;
      --bz-col: #1A1A1A;
      --bz-yellow: #FFC107;
      --bz-yellow-dim: #B8860B;
      --bz-silver: #C9CDD2;
      --bz-charcoal: #111111;
      --bz-status-blue: #5B8DB8;
      --bz-status-lavender: #9B8EC4;
      --bz-status-green: #5BAF6B;
      --bz-status-red: #C45B5B;
      --bz-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--bz-font);
      color: #E8E8E8;
      background: var(--bz-black);
      margin: 0;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid #222;
      background: var(--bz-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header .brand strong {
      letter-spacing: .06em;
      font-size: 1.15rem;
      color: var(--bz-yellow);
      text-transform: uppercase;
      font-weight: 800;
    }
    header .brand .mascot-mark {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    header nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    header nav a {
      color: #999;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    header nav a:hover { color: var(--bz-yellow); }
    header nav a.active { color: var(--bz-yellow); font-weight: 600; }
    header nav .phase {
      color: var(--bz-yellow);
      font-weight: 600;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    h2 {
      font-size: 1.05rem;
      margin: 0 0 0.5rem;
      color: var(--bz-yellow);
      font-weight: 600;
    }
    p, li {
      color: #C8C8C8;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .muted { color: #777; font-size: 0.82rem; }
    .mascot {
      display: block;
      margin: 0 auto 1.2rem;
      max-width: 180px;
      width: 100%;
      height: auto;
      opacity: 0.92;
    }
    .mascot-sm {
      width: 64px;
      height: auto;
      margin: 0.5rem auto 1rem;
      display: block;
    }
    .card {
      background: var(--bz-panel);
      border: 1px solid #2A2A2A;
      padding: 1rem 1.1rem;
      margin: 0.7rem 0;
      border-radius: 4px;
    }
    .card h2 { color: var(--bz-yellow); }
    .card p, .card li { color: #C8C8C8; }
    .card ul { margin: 0; padding-left: 1.2rem; }
    .card ul li { color: #C8C8C8; margin-bottom: 0.3rem; }
    .hidden { display: none; }
    .row {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--bz-yellow);
      background: var(--bz-yellow);
      color: var(--bz-black);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 4px;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--bz-yellow-dim); border-color: var(--bz-yellow-dim); }
    button:active { transform: scale(0.98); }
    button.secondary {
      background: transparent;
      color: var(--bz-yellow);
      border: 1px solid #444;
    }
    button.secondary:hover {
      border-color: var(--bz-yellow);
      background: rgba(255,193,7,0.08);
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="mascot-mark" src="brand/revision6_expressions_16-smiling.png" alt="BeeZilla" />
      <strong>BeeZilla</strong>
    </div>
    <nav>
      <a href="/buzzy/" id="jobsLink">Your jobs</a>
      <a href="/buzzy/talk.html" id="talkLink">Talk to BeeZilla</a>
      <a href="/buzzy/remember.html" id="memLink" class="active">What BeeZilla remembers</a>
      <a href="/login" class="account-link">Sign in</a>
      <span class="phase" id="phaseLabel">What BeeZilla remembers</span>
    </nav>
  </header>
  <main id="app"></main>

  <script>
    const QUESTIONS = [
      { id: "what_happened", prompt: "What happened out there — which parts of the fence got damaged?" },
      { id: "rough_size", prompt: "Roughly how much fence are we talking?" },
      { id: "material_supplier", prompt: "Who's getting the materials?" },
      { id: "budget_range", prompt: "Got a budget range in mind?" },
      { id: "timing", prompt: "When do you need this done by?" },
      { id: "done_right_check", prompt: "How will you know when it's done right?" },
      { id: "quote_count", prompt: "Getting quotes from a few contractors?" },
      { id: "exclusions", prompt: "Anything you definitely don't want done?" },
    ];

    const STORAGE_KEY = "beezilla-jobs-v1";
    const LEGACY_KEY = "beezilla-dana-v1";

    function jobTitle(j) {
      if (j.problem) return j.problem.slice(0, 72);
      if (j.template) return j.template + " job";
      const happened = (j.answers && j.answers.what_happened) || "";
      if (happened) return happened.slice(0, 72);
      return "New job";
    }

    function jobComplete(j) {
      return !!(j && j.screen === "result");
    }

    const catalog = { currentId: null, hideCompleted: true, jobs: [], userId: null };
    let state = { id: null, createdAt: Date.now(), template: null, problem: "", messages: [], screen: "jobs", q: 0, answers: {}, skipped: {}, version: 0, approved: false, pause: null, board: { Waiting: [], Working: [], "Needs you": [], Done: [] }, events: [] };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && Array.isArray(saved.jobs)) {
            catalog.jobs = saved.jobs;
            catalog.hideCompleted = saved.hideCompleted !== false;
            catalog.userId = saved.userId || catalog.userId;
            catalog.currentId = saved.currentId || (saved.jobs[0] && saved.jobs[0].id) || null;
            const cur = catalog.jobs.find((j) => j.id === catalog.currentId);
            if (cur) state = cur;
            else if (catalog.jobs[0]) { state = catalog.jobs[0]; catalog.currentId = state.id; }
            else { state = { ...state }; catalog.jobs = [state]; catalog.currentId = state.id; }
            if (!state.screen || state.screen === "intro") state.screen = "jobs";
            return true;
          }
        }
        const legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) {
          const old = JSON.parse(legacy);
          if (old && typeof old === "object") {
            state = { ...state, ...old, id: "job_legacy" };
            catalog.jobs = [state];
            catalog.currentId = state.id;
            state.screen = "jobs";
            return true;
          }
        }
      } catch (_) { /* corrupt */ }
      catalog.jobs = [state];
      catalog.currentId = state.id;
      state.screen = "jobs";
      return false;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadState();
    if (!catalog.userId) catalog.userId = "bz_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    const $ = (html) => { document.getElementById("app").innerHTML = html; };

    function goRemember() {
      const stm = Object.keys(state.answers).length
        ? "<ul>" + QUESTIONS.map((q) => "<li>" + q.prompt.split("—")[0] + ": " + escapeHtml(state.answers[q.id] || "—") + "</li>").join("") + "</ul>"
        : "<p class='muted'>Nothing for this job yet — we have not asked you anything.</p>";
      const completedJobs = catalog.jobs.filter(jobComplete);
      const acrossJobs = completedJobs.length
        ? "<ul>" + completedJobs.map((j) => "<li>" + escapeHtml(jobTitle(j)) + "</li>").join("") + "</ul><p class='muted'>This list is on this device. Honcho (the real across-jobs memory) is not wired to this demo.</p>"
        : "<p>Nothing yet across jobs. BeeZilla does not pretend to know you.</p><p class='muted'>Later: short facts you can read, correct, or forget. Not model names, not your wallet.</p>";
      document.getElementById("app").innerHTML =
        "<img class='mascot' src='brand/revision6_expressions_12-content.png' alt='BeeZilla' />" +
        "<h1>What BeeZilla remembers</h1>" +
        "<div class='card'><h2>This job</h2>" + stm + "<p class='muted'>This stays with the paperwork until the job is done.</p></div>" +
        "<div class='card'><h2>Across jobs</h2>" + acrossJobs + "</div>" +
        "<div class='card'><h2>What is not stored</h2><ul><li>Model names and token counts</li><li>Wallet or payment details</li><li>Full interview dumps forever</li></ul></div>" +
        "<p class='muted'>Device id (will be your Honcho peer later): " + escapeHtml(catalog.userId || "—") + "</p>" +
        "<div class='row'><button id='forgetJob' class='secondary'>Forget this job</button><button id='back' class='secondary'>Back</button></div>";
      document.getElementById("forgetJob").onclick = () => {
        state.answers = {};
        state.skipped = {};
        state.q = 0;
        goRemember();
      };
      document.getElementById("back").onclick = () => {
        window.location.href = "/buzzy/";
      };
    }

    goRemember();
  </script>
<script src="common.js"></script>
<script>(function(){var run=function(){if(window.__bzHeader)window.__bzHeader("memory")};if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run)})();</script>
</body>
</html>
