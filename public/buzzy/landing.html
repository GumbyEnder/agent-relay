<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeeZilla — Your work, handled</title>
  <link rel="icon" href="/brand/bz-favicon-180.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #0A0A0A;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header .brand { display: flex; align-items: center; gap: 0.6rem; }
    header .brand img { width: 28px; height: 28px; border-radius: 4px; }
    header .brand strong {
      letter-spacing: 0.06em; font-size: 1.15rem; color: #ffc107;
      text-transform: uppercase; font-weight: 800;
    }
    main { flex: 1; display: grid; place-items: center; padding: 2rem 1.5rem; }
    .hero { max-width: 460px; width: 100%; text-align: center; }
    .hero .mascot {
      width: 128px; height: 128px; object-fit: contain; margin-bottom: 1rem;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
    }
    .hero h1 { font-size: 1.9rem; font-weight: 800; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
    .hero p { color: #9a9a9a; font-size: 1rem; line-height: 1.5; margin: 0 0 1.75rem; }
    .actions { display: flex; flex-direction: column; gap: 0.7rem; }
    .btn {
      display: block; width: 100%; padding: 0.8rem 1rem; border-radius: 8px;
      font-size: 1rem; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer;
    }
    .btn-primary { background: #ffc107; color: #0A0A0A; border: 1px solid #ffc107; }
    .btn-primary:hover { background: #ffd43b; }
    .btn-secondary { background: transparent; color: #fff; border: 1px solid #3a3a3a; }
    .btn-secondary:hover { border-color: #ffc107; color: #ffc107; }
    footer {
      padding: 1rem 1.5rem; text-align: center; color: #666;
      font-size: 0.8rem; border-top: 1px solid #222;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="" />
      <strong>BeeZilla</strong>
    </div>
  </header>
  <main>
    <div class="hero">
      <img class="mascot" src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="BeeZilla mascot" />
      <h1>Your work, handled.</h1>
      <p>Describe a job and BeeZilla turns it into a clear, checked deliverable — your drafts, decisions, and documents kept in one place.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/buzzy/login">Log in</a>
        <a class="btn btn-secondary" href="/buzzy/login?mode=register">Register</a>
      </div>
    </div>
  </main>
  <footer>BeeZilla helps you get the work done — this is not legal or financial advice.</footer>
  <script>
    // Signed in already? This page is not for you. The server sends a signed-in
    // visitor straight to Talk; this covers a copy shown without asking it (Back
    // or a restored tab, from the page cache). It asks the server the very question
    // a page load asks — this address again, without following the answer — so
    // the two can never disagree (a disabled account is "signed out" to both).
    // A redirect is a yes; anything else, or no answer, leaves the page alone.
    (function () {
      var here = function () { return /^\/buzzy\/landing(\.html)?\/?$/.test(location.pathname); };
      function check() {
        if (!here()) return;
        fetch(location.pathname + location.search, {
          method: "HEAD", credentials: "same-origin", cache: "no-store", redirect: "manual",
        })
          .then(function (r) {
            var moved = r.type === "opaqueredirect" || (r.status >= 300 && r.status < 400);
            if (!moved || !here()) return;
            // Back inside an app that already runs the shell (a restored tab): let the
            // shell take us, so the document that is listening stays alive.
            var shell = window.BeeZillaShell;
            if (shell && shell.go) { shell.go("/buzzy/talk"); return; }
            // A cold landing is the welcome page: the shell is not up yet and this page
            // has no header and no recogniser, so there is nothing to keep alive and a
            // hard load is the only way in. That one load is named in
            // scripts/gate-hard-nav.mjs (HARD_NAV_ALLOW) rather than hidden.
            window.location.replace("/buzzy/talk");
          })
          .catch(function () {});
      }
      check();
      if (!window.__bzLandingShow) {
        window.__bzLandingShow = true;
        window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
      }
    })();
  </script>
</body>
</html>
