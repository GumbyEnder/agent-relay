<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeeZilla — Sign in / Register</title>
  <link rel="icon" href="/brand/bz-favicon-180.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #0A0A0A;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
    header .brand img { width: 28px; height: 28px; border-radius: 4px; }
    header .brand strong {
      letter-spacing: 0.06em; font-size: 1.15rem; color: #ffc107;
      text-transform: uppercase; font-weight: 800;
    }
    main { flex: 1; display: grid; place-items: center; padding: 2rem 1.5rem; }
    .card { width: 100%; max-width: 420px; }
    .mascot { width: 84px; height: 84px; object-fit: contain; display: block; margin: 0 auto 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.35rem; text-align: center; }
    .sub { color: #9a9a9a; font-size: 0.92rem; text-align: center; margin: 0 0 1.5rem; line-height: 1.5; }
    .sub strong { color: #fff; font-weight: 600; word-break: break-all; }
    .label-row { display: flex; justify-content: space-between; align-items: baseline; }
    label { display: block; font-size: 0.8rem; color: #9a9a9a; margin: 0 0 0.35rem; font-weight: 600; }
    input {
      width: 100%; padding: 0.75rem 0.85rem; border-radius: 8px; margin-bottom: 0.9rem;
      background: #141414; border: 1px solid #2a2a2a; color: #fff; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #ffc107; }
    input[aria-invalid="true"] { border-color: #b3424c; }
    .field-error { color: #ffb4b4; font-size: 0.85rem; margin: -0.5rem 0 0.9rem; min-height: 0; }
    .field-error:empty { display: none; }
    button.primary, button.secondary {
      width: 100%; padding: 0.8rem 1rem; border-radius: 8px; font-size: 1rem;
      font-weight: 700; cursor: pointer; margin-bottom: 0.7rem;
    }
    button.primary { background: #ffc107; color: #0A0A0A; border: 1px solid #ffc107; }
    button.primary:disabled, button.secondary:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: transparent; color: #fff; border: 1px solid #3a3a3a; }
    button.secondary:hover { border-color: #ffc107; color: #ffc107; }
    button.link {
      display: block; margin: 0.2rem auto 0; padding: 0.4rem; border: 0; background: none;
      color: #9a9a9a; font-size: 0.88rem; cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px;
    }
    button.link:hover { color: #ffc107; }
    button.toggle {
      border: 0; background: none; color: #9a9a9a; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; padding: 0 0 0.35rem;
    }
    button.toggle:hover { color: #ffc107; }
    .msg { display: none; padding: 0.75rem 0.85rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; line-height: 1.45; }
    .msg.show { display: block; }
    .msg.error { background: #2a1214; border: 1px solid #5b1f24; color: #ffb4b4; }
    .msg.ok { background: #10251a; border: 1px solid #1f5b3a; color: #a9f0c4; }
    footer { padding: 1rem 1.5rem; text-align: center; color: #666; font-size: 0.8rem; border-top: 1px solid #222; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/buzzy/talk">
      <img src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="" />
      <strong>BeeZilla</strong>
    </a>
  </header>

  <main>
    <div class="card">
      <img class="mascot" src="/buzzy/brand/revision6_expressions_16-smiling.png" alt="BeeZilla mascot" />
      <h1 id="title">Sign in / Register</h1>
      <p class="sub" id="subtitle">Put in your email to continue.</p>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <!-- Step 1–2: email, then (for a known email) the password appears below it. -->
      <form id="form" autocomplete="on" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com" />

        <div id="passwordRow" class="hidden">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="passwordError" />
          <div class="field-error" id="passwordError" aria-live="polite"></div>
        </div>

        <button class="primary" id="submit" type="submit">Next</button>
        <button class="link hidden" id="forgot" type="button">Forgot password? Email me a sign-in link</button>
      </form>

      <!-- After a sign-in link was emailed. -->
      <div id="sent" class="hidden">
        <button class="secondary" id="resend" type="button">Resend link</button>
        <button class="link" id="changeEmail" type="button">Use a different email</button>
      </div>

      <!-- After a link sign-in: choose a password. -->
      <form id="setForm" class="hidden" autocomplete="on" novalidate>
        <input id="setEmail" name="username" type="email" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true" />
        <div class="label-row">
          <label for="newPassword">Password</label>
          <button class="toggle" id="showNew" type="button" aria-controls="newPassword">Show</button>
        </div>
        <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" aria-describedby="newPasswordError" />
        <div class="field-error" id="newPasswordError" aria-live="polite"></div>
        <button class="primary" id="save" type="submit">Save password</button>
        <button class="link hidden" id="notNow" type="button">Not now</button>
      </form>
    </div>
  </main>

  <footer>BeeZilla helps you get the work done — this is not legal or financial advice.</footer>

  <script>
    (function () {
      var MIN_PASSWORD = 8;
      // "Wrong password" waits until the visitor stops typing for this long.
      var CHECK_AFTER_MS = 2000;

      var params = new URLSearchParams(window.location.search);
      var $ = function (id) { return document.getElementById(id); };
      var title = $("title"), subtitle = $("subtitle"), msg = $("msg");
      var form = $("form"), email = $("email"), passwordRow = $("passwordRow");
      var password = $("password"), passwordError = $("passwordError");
      var submit = $("submit"), forgot = $("forgot");
      var sent = $("sent"), resend = $("resend"), changeEmail = $("changeEmail");
      var setForm = $("setForm"), setEmail = $("setEmail"), newPassword = $("newPassword");
      var newPasswordError = $("newPasswordError"), save = $("save"), notNow = $("notNow"), showNew = $("showNew");

      var step = "email";        // email | password | sent | set
      var busy = false;
      var checkTimer = null;
      var lastWrong = null;      // the password value already known to be wrong
      var linkEmail = "";        // where the last sign-in link went
      // Every request takes a ticket. Going back to the email step voids the
      // tickets in flight, so a late answer can neither keep "Next" dead nor
      // pull the page back to a screen the visitor already left.
      var ticket = 0;
      function begin() { busy = true; return ++ticket; }
      function live(t) { return t === ticket; }
      function done(t) { if (t === ticket) busy = false; }

      // ── helpers ──────────────────────────────────────────────────────
      function show(kind, text) { msg.className = "msg show " + kind; msg.textContent = text; }
      function clearMsg() { msg.className = "msg"; msg.textContent = ""; }
      function setText(el, text) { el.textContent = text; }
      function setSubtitle(before, bold, after) {
        subtitle.textContent = "";
        subtitle.appendChild(document.createTextNode(before));
        if (bold) {
          var b = document.createElement("strong");
          b.textContent = bold;
          subtitle.appendChild(b);
          subtitle.appendChild(document.createTextNode(after || ""));
        }
      }
      function wrongPassword(on, text) {
        passwordError.textContent = on ? (text || "Wrong password") : "";
        password.setAttribute("aria-invalid", on ? "true" : "false");
      }
      // Every request answers or fails within 20 s, so no button can stay on
      // "Checking…" / "Logging in…" / "Saving…": a timeout lands in the same
      // .catch that re-enables the controls.
      var REQUEST_TIMEOUT_MS = 20000;
      function api(method, path, body) {
        var controller = typeof AbortController === "function" ? new AbortController() : null;
        var timer = controller ? setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS) : null;
        return fetch(path, {
          method: method,
          headers: body ? { "content-type": "application/json" } : {},
          credentials: "same-origin",
          body: body ? JSON.stringify(body) : undefined,
          signal: controller ? controller.signal : undefined,
        }).then(function (r) {
          // An aborted body read rejects too, so the timer covers the whole answer.
          return r.json().catch(function (err) {
            if (err && err.name === "AbortError") throw err;
            return {};
          }).then(function (data) {
            clearTimeout(timer);
            return {
              ok: r.ok,
              status: r.status,
              data: data || {},
              retryAfter: Number(r.headers.get("X-Retry-After")) || 0,
            };
          });
        }, function (err) {
          clearTimeout(timer);
          throw err;
        });
      }
      function codeOf(res) { return (res.data && res.data.code) || ""; }
      function tooMany(res) {
        if (res.status !== 429) return false;
        var wait = res.retryAfter;
        show("error", wait > 0
          ? "Too many tries. Try again in " + wait + (wait === 1 ? " second." : " seconds.")
          : "Too many tries. Wait a minute, then try again.");
        return true;
      }
      function currentEmail() { return (email.value || "").trim().toLowerCase(); }
      function validEmail(addr) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr); }
      function destination() {
        var next = params.get("next");
        // Only same-origin paths; a login page must never be an open redirect.
        if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") return next;
        return "/buzzy/talk";
      }
      function enter() { window.location.replace(destination()); }
      function afterLinkURL() {
        var next = params.get("next");
        var url = "/buzzy/login?step=password";
        if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") url += "&next=" + encodeURIComponent(next);
        return url;
      }

      // The address bar is part of the screen (main's BZ-6 nit: a reload or a
      // bookmark must bring back what the user was looking at). This page has
      // one form for sign-in and register, so it never keeps the old
      // ?mode=register that the landing page's Register button still sends.
      // Edit the live URL so next, verified and the link notices survive.
      function syncUrl() {
        try {
          var u = new URL(location.href);
          if (!u.searchParams.has("mode")) return;
          u.searchParams.delete("mode");
          var qs = u.searchParams.toString();
          history.replaceState(null, "", u.pathname + (qs ? "?" + qs : "") + u.hash);
        } catch (e) { /* a login form must never die on history */ }
      }

      // ── steps ────────────────────────────────────────────────────────
      function toEmailStep() {
        step = "email";
        ticket++;              // whatever was in flight no longer owns the page
        busy = false;
        clearTimeout(checkTimer);
        form.classList.remove("hidden");
        sent.classList.add("hidden");
        setForm.classList.add("hidden");
        passwordRow.classList.add("hidden");
        forgot.classList.add("hidden");
        password.value = "";
        lastWrong = null;
        wrongPassword(false);
        setText(title, "Sign in / Register");
        setSubtitle("Put in your email to continue.");
        submit.textContent = "Next";
        submit.disabled = false;
      }
      function toPasswordStep() {
        step = "password";
        passwordRow.classList.remove("hidden");
        forgot.classList.remove("hidden");
        submit.textContent = "Log in";
        setSubtitle("Welcome back. Put in your password.");
        try { password.focus(); } catch (e) {}
      }
      function toSentStep(addr, kind) {
        step = "sent";
        linkEmail = addr;
        form.classList.add("hidden");
        setForm.classList.add("hidden");
        sent.classList.remove("hidden");
        setText(title, "Check your email");
        var after = kind === "new"
          ? ". Open it on this device to finish creating your account."
          : kind === "forgot"
            ? ". Open it on this device, then set a new password."
            : ". Open it on this device to sign in.";
        setSubtitle("We sent a link to ", addr, after);
      }
      function toSetStep(user, replacing) {
        step = "set";
        form.classList.add("hidden");
        sent.classList.add("hidden");
        setForm.classList.remove("hidden");
        setEmail.value = (user && user.email) || "";
        setText(title, replacing ? "Set a new password" : "Set a password");
        setSubtitle(replacing
          ? "You're signed in. Choose a new password. Your other devices will be signed out."
          : "You're signed in. Choose a password for next time.");
        notNow.classList.toggle("hidden", !replacing);
        try { newPassword.focus(); } catch (e) {}
      }

      // ── step 1: email → Next ─────────────────────────────────────────
      function lookup() {
        var addr = currentEmail();
        if (!validEmail(addr)) { show("error", "Enter your email address."); return; }
        var t = begin(); submit.disabled = true; submit.textContent = "Checking…";
        api("POST", "/api/auth/email-first/lookup", { email: addr })
          .then(function (res) {
            if (!live(t)) return;
            if (tooMany(res)) return toEmailStep();
            if (!res.ok) {
              toEmailStep();
              show("error", codeOf(res) === "INVALID_EMAIL" ? "Enter a valid email address." : "Something went wrong. Try again.");
              return;
            }
            submit.disabled = false;
            if (res.data.hasPassword) return toPasswordStep();
            // Known email without a password, or a new email: send a link.
            return sendLink(addr, res.data.exists ? "signin" : "new");
          })
          .catch(function () {
            if (!live(t)) return;
            toEmailStep();
            show("error", "Network problem. Try again.");
          })
          .then(function () {
            done(t);
            submit.disabled = false;
            if (step === "email") submit.textContent = "Next";
          });
      }

      function sendLink(addr, kind) {
        var t = begin();
        return api("POST", "/api/auth/sign-in/magic-link", {
          email: addr,
          callbackURL: afterLinkURL(),
          newUserCallbackURL: afterLinkURL(),
          errorCallbackURL: "/buzzy/login?link=expired",
        }).then(function (res) {
          if (!live(t)) return;   // the visitor changed the email meanwhile
          if (tooMany(res)) return;
          if (!res.ok) { show("error", "We couldn't send the email. Try again."); return; }
          clearMsg();
          toSentStep(addr, kind);
        }).catch(function () {
          if (live(t)) show("error", "Network problem. Try again.");
        }).then(function () { done(t); });
      }

      // ── step 2: password (checked 2 s after typing stops, or on Log in) ─
      function attemptPassword(fromTimer) {
        clearTimeout(checkTimer);
        if (step !== "password") return;
        var addr = currentEmail();
        var pass = password.value || "";
        if (!pass) { if (!fromTimer) wrongPassword(true, "Put in your password."); return; }
        if (pass === lastWrong) { wrongPassword(true); return; }
        if (pass.length < MIN_PASSWORD) { lastWrong = pass; wrongPassword(true); return; }
        if (busy) {
          // A check is still running; look at this value as soon as it's done.
          checkTimer = setTimeout(function () { attemptPassword(fromTimer); }, 300);
          return;
        }
        var t = begin();
        submit.disabled = true; submit.textContent = "Logging in…";
        api("POST", "/api/auth/sign-in/email", { email: addr, password: pass, rememberMe: true })
          .then(function (res) {
            if (res.ok) { enter(); return; }
            if (!live(t) || password.value !== pass) return; // moved on, or typed on meanwhile
            if (tooMany(res)) return;
            var code = codeOf(res);
            if (code === "EMAIL_NOT_VERIFIED") {
              show("ok", "Confirm your email first. We just sent a link to " + addr + ".");
              return;
            }
            if (res.status !== 401) {
              // Only a 401 is a verdict on the password. A server fault must not
              // be remembered as "wrong", or retyping the right one would never
              // be sent again.
              var m = res.status < 500 && res.data && res.data.message;
              show("error", m || "Something went wrong. Try again.");
              return;
            }
            lastWrong = pass;
            wrongPassword(true);
          })
          .catch(function () { if (live(t)) show("error", "Network problem. Try again."); })
          .then(function () {
            done(t);
            if (live(t) && step === "password") { submit.disabled = false; submit.textContent = "Log in"; }
          });
      }

      password.addEventListener("input", function () {
        clearTimeout(checkTimer);
        wrongPassword(false);
        clearMsg();
        if (!password.value) return;
        checkTimer = setTimeout(function () { attemptPassword(true); }, CHECK_AFTER_MS);
      });

      email.addEventListener("input", function () {
        clearMsg();
        if (step === "password") toEmailStep();
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearMsg();
        if (step === "email") { if (!busy) lookup(); return; }
        if (step === "password") attemptPassword(false);
      });

      forgot.addEventListener("click", function () {
        if (busy) return;
        clearTimeout(checkTimer);
        clearMsg();
        sendLink(currentEmail(), "forgot");
      });

      resend.addEventListener("click", function () {
        if (busy || !linkEmail) return;
        var t = begin();
        resend.disabled = true;
        api("POST", "/api/auth/sign-in/magic-link", {
          email: linkEmail,
          callbackURL: afterLinkURL(),
          newUserCallbackURL: afterLinkURL(),
          errorCallbackURL: "/buzzy/login?link=expired",
        }).then(function (res) {
          if (!live(t)) return;   // "Use a different email" was pressed meanwhile
          if (tooMany(res)) return;
          if (res.ok) show("ok", "Sent again. Check your inbox (and spam folder).");
          else show("error", "We couldn't send the email. Try again.");
        }).catch(function () {
          if (live(t)) show("error", "Network problem. Try again.");
        }).then(function () { done(t); resend.disabled = false; });
      });

      changeEmail.addEventListener("click", function () {
        clearMsg();
        toEmailStep();
        email.value = "";
        try { email.focus(); } catch (e) {}
      });

      // ── step 3: after a link sign-in, set a password ─────────────────
      showNew.addEventListener("click", function () {
        var showing = newPassword.type === "text";
        newPassword.type = showing ? "password" : "text";
        showNew.textContent = showing ? "Show" : "Hide";
      });
      newPassword.addEventListener("input", function () {
        newPasswordError.textContent = "";
        newPassword.setAttribute("aria-invalid", "false");
      });
      notNow.addEventListener("click", enter);

      setForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (busy) return;
        clearMsg();
        var pass = newPassword.value || "";
        if (pass.length < MIN_PASSWORD) {
          newPasswordError.textContent = "Use at least " + MIN_PASSWORD + " characters.";
          newPassword.setAttribute("aria-invalid", "true");
          return;
        }
        var t = begin(); save.disabled = true; save.textContent = "Saving…";
        api("POST", "/api/auth/email-first/set-password", { newPassword: pass })
          .then(function (res) {
            if (res.ok) { enter(); return; }
            if (tooMany(res)) return;
            if (res.status === 401) { toEmailStep(); show("error", "Your sign-in ended. Put in your email to continue."); return; }
            var message = (res.data && res.data.message) || "We couldn't save that password. Try again.";
            newPasswordError.textContent = message;
            newPassword.setAttribute("aria-invalid", "true");
          })
          .catch(function () { show("error", "Network problem. Try again."); })
          .then(function () { done(t); save.disabled = false; save.textContent = "Save password"; });
      });

      // ── start ────────────────────────────────────────────────────────
      function getSession() {
        return fetch("/api/auth/get-session", { credentials: "same-origin" })
          .then(function (r) { return r.json().catch(function () { return null; }); })
          .catch(function () { return null; });
      }

      syncUrl();

      if (params.get("link") === "expired" || params.get("error")) {
        show("error", "That link has expired or was already used. Put in your email to get a new one.");
      } else if (params.get("verified") === "1") {
        show("ok", "Email confirmed. Put in your email to sign in.");
      }

      if (params.get("step") === "password") {
        // Arrived from a sign-in link: set a password (or skip ahead if one is set).
        Promise.all([api("GET", "/api/auth/email-first/status"), getSession()])
          .then(function (out) {
            var status = out[0], session = out[1];
            if (!status.ok || !session || !session.user) { toEmailStep(); try { email.focus(); } catch (e) {} return; }
            if (!status.data.hasPassword) return toSetStep(session.user, false);
            if (status.data.canReplace) return toSetStep(session.user, true);
            enter();
          })
          .catch(function () { toEmailStep(); });
      } else {
        // Already signed in (sessions last for good): go straight in.
        getSession().then(function (s) {
          if (s && s.session && step === "email" && !email.value) enter();
        });
        try { email.focus(); } catch (e) {}
      }
    })();
  </script>
</body>
</html>
